/* ==========================================================
 * MARKET SIGNAL · VTV/QQQ ROC regime
 * Layer 1 of Signal → Portfolio Risk → Pre-Trade. Set once on the main page;
 * every checklist reads it. Four phases split one ROC cycle:
 *   ① 负区·下行  ② 负区·掉头向上 (S1)  ③ 正区·上行 (after S2)  ④ 正区·掉头向下 (S3)
 * S4 (下穿零轴) returns the cycle to ①.
 * ========================================================== */
const ROC_PHASE_KEY = 'pretrade_roc_phase';
const ROC_STALE_DAYS = 7;
const ROC_PHASES = {
  1: { short: '① 负区 ↓',   label: '① 负区 · 下行',     meaning: '成长领涨', cls: 'pass' },
  2: { short: '② 负区 ↑拐', label: '② 负区 · 掉头向上', meaning: '顶部预警 · 噪音大', cls: 'pending' },
  3: { short: '③ 正区 ↑',   label: '③ 正区 · 上行',     meaning: '下跌确认 · 滞后', cls: 'fail' },
  4: { short: '④ 正区 ↓拐', label: '④ 正区 · 掉头向下', meaning: '底部预警 · 最准', cls: 'accent' },
};
// strategy × phase → 'pass' | 'soft' (soft fail) | 'hard' (hard fail)
const ROC_MATRIX = {
  leaps:  { 1: 'pass', 2: 'soft', 3: 'hard', 4: 'pass' },
  csp:    { 1: 'pass', 2: 'soft', 3: 'soft', 4: 'pass' },
  sniper: { 1: 'pass', 2: 'soft', 3: 'soft', 4: 'pass' },
  call:   { 1: 'pass', 2: 'pass', 3: 'pass', 4: 'soft' },   // PMCC / CC short call
};
const ROC_DESC = {
  leaps: {
    1: '成长领涨. 允许入场.',
    2: '顶部预警, 历史约 50/50. 软执行; 降仓位或等待确认.',
    3: '下跌确认, 历史 4/4 延续下跌. 禁止开仓 / 加仓, 等待 ④.',
    4: '底部预警, 历史 4/4 后续大涨. 最佳窗口; RSI ≤ 40 时机最准.',
  },
  csp: {
    1: '成长领涨. 正常.',
    2: '顶部预警, 噪音大. 软执行; 降 Delta 或仓位.',
    3: '下跌确认, 多为中继. 软执行; strike 更深, 仓位更小.',
    4: '底部预警, 历史 4/4 后续大涨. 有利窗口.',
  },
  sniper: {
    1: '成长领涨. 狙击机会少.',
    2: '顶部预警. 软执行; 下跌可能刚开始.',
    3: '下跌确认, 可能为中继. 软执行; breakeven 更深于支撑.',
    4: '底部预警, 历史 4/4 后续大涨. 最佳窗口; RSI ≤ 40 时机最准.',
  },
  call: {
    1: '涨势中. 按 Delta / KDJ 门槛执行.',
    2: '顶部预警. 卖 call 有利.',
    3: '下跌确认. 卖 call 有利.',
    4: '底部预警, 历史 4/4 后续大涨. 软执行; short call 易被穿, 降 Delta 或暂缓.',
  },
};

function loadRocPhase() {
  try {
    const o = JSON.parse(localStorage.getItem(ROC_PHASE_KEY) || 'null');
    if (o && ROC_PHASES[o.phase] && Number.isFinite(o.updatedAt)) return { phase: o.phase, updatedAt: o.updatedAt };
  } catch (e) {}
  return null;
}
function saveRocPhase(phase) {
  if (!ROC_PHASES[phase]) return null;
  const o = { phase, updatedAt: Date.now() };
  try { localStorage.setItem(ROC_PHASE_KEY, JSON.stringify(o)); } catch (e) {}
  return o;
}
function rocAgeDays(o) { return o ? Math.max(0, Math.floor((Date.now() - o.updatedAt) / 86400000)) : null; }
// Sync: keep whichever device confirmed the phase most recently
function _mergeRemoteRocPhase(raw) {
  try {
    const r = JSON.parse(raw);
    if (!r || !ROC_PHASES[r.phase] || !Number.isFinite(r.updatedAt)) return;
    const l = loadRocPhase();
    if (!l || r.updatedAt > l.updatedAt) localStorage.setItem(ROC_PHASE_KEY, JSON.stringify({ phase: r.phase, updatedAt: r.updatedAt }));
  } catch (e) {}
}

// Which phase applies right now: today's (live checklist) or the one saved with a snapshot
function _rocPhaseForEval() {
  if (__tempStateDepth > 0) {
    if (Object.prototype.hasOwnProperty.call(state, 'rocPhaseAtSave')) {
      const p = state.rocPhaseAtSave;
      return { phase: ROC_PHASES[p] ? p : null, legacy: false, fromSnapshot: true };
    }
    return { phase: null, legacy: true };   // saved before the regime layer → original checkbox
  }
  const o = loadRocPhase();
  return { phase: o ? o.phase : null, legacy: false, age: rocAgeDays(o) };
}

function rocRegimeItem(kind) {
  const base = { group: 'Market environment · 宏观环境', id: 'vtv_qqq_roc', regimeCheck: true, regimeKind: kind };
  const ev = _rocPhaseForEval();
  if (ev.legacy) {
    return { ...base, legacy: true, hard: kind === 'leaps',
      title: kind === 'leaps' ? 'VTV/QQQ ROC 状态 · 非红灯 (旧版勾选)' : 'VTV/QQQ ROC 状态观察 (旧版勾选)',
      desc: '旧版快照, 按当时勾选判定.' };
  }
  if (!ev.phase) {
    return { ...base, hard: kind === 'leaps', title: 'VTV/QQQ ROC 阶段 · 未设置',
      desc: '未设置 Market Signal.' };
  }
  const rule = ROC_MATRIX[kind][ev.phase];
  let desc = ROC_DESC[kind][ev.phase];
  if (!ev.fromSnapshot && ev.age >= ROC_STALE_DAYS) desc += ` ⚠ ${ev.age} 天未确认.`;
  return { ...base, hard: kind === 'leaps' && rule !== 'soft',
    title: `VTV/QQQ ROC 阶段 · ${ROC_PHASES[ev.phase].label}`, desc };
}
function rocRegimeVerdict(item) {
  if (item.legacy) {
    const s = state.items ? state.items[item.id] : null;
    return s === 'pass' ? 'pass' : s === 'fail' ? 'fail' : 'pending';
  }
  const ev = _rocPhaseForEval();
  if (!ev.phase) return 'pending';
  const rule = (ROC_MATRIX[item.regimeKind] || {})[ev.phase];
  if (!rule) return 'pending';
  return rule === 'pass' ? 'pass' : 'fail';
}

/* ---------- Main page · Market Signal panel ---------- */
function marketSignalHTML() {
  const o = loadRocPhase();
  const age = rocAgeDays(o);
  const stale = !!o && age >= ROC_STALE_DAYS;
  const btns = [1, 2, 3, 4].map(n => `
    <button class="ms-btn ms-${ROC_PHASES[n].cls} ${o && o.phase === n ? 'active' : ''}" onclick="setRocPhase(${n})"
      title="${esc(ROC_PHASES[n].label)} · ${esc(ROC_PHASES[n].meaning)}">${ROC_PHASES[n].short}</button>`).join('');
  const status = !o
    ? `<span class="ms-age stale">未设置</span>`
    : `<span class="ms-age ${stale ? 'stale' : ''}">${age === 0 ? '今天确认' : age + ' 天前确认'}${stale ? ' · 点当前阶段续期' : ''}</span>`;
  const meaning = o
    ? `<div class="ms-meaning"><b class="ms-t-${ROC_PHASES[o.phase].cls}">${ROC_PHASES[o.phase].label}</b> — ${ROC_PHASES[o.phase].meaning}</div>`
    : `<div class="ms-meaning">选择当前阶段</div>`;
  return `
    <div class="ms-panel ${stale || !o ? 'ms-needs-attention' : ''}">
      <div class="ms-head"><span class="ms-title">Market Signal · VTV/QQQ ROC</span>${status}</div>
      <div class="ms-btns">${btns}</div>
      ${meaning}
    </div>`;
}
window.setRocPhase = (n) => {
  const prev = loadRocPhase();
  if (!saveRocPhase(n)) return;
  render();
  showToast(prev && prev.phase === n ? `已续期 ${ROC_PHASES[n].label}` : `市场阶段 → ${ROC_PHASES[n].label}`, 'info');
  if (typeof scheduleAutoPushToGist === 'function') scheduleAutoPushToGist();
};

/* ==========================================================
 * RISK MONITOR · weighted multi-factor risk gauge
 * Each variable maps its own value onto 0–100 with its own thresholds
 * (安全 0–25 · 关注 25–50 · 警戒 50–75 · 危险 75–100). The composite is the
 * weighted power mean (p = 3): high scores are amplified so a red item can't hide
 * behind green ones, yet every weight always moves the needle (no hard floor).
 * Items in 危险 are surfaced separately. Variables without data are excluded.
 * Pure functions of a Portfolio object → the same code scores today's book
 * and the simulated book after a pending trade.
 * ========================================================== */
const RISK_WEIGHTS_KEY = 'pretrade_risk_weights';
const RISK_LEVELS = [
  { upTo: 25,  key: 'safe',   label: '安全' },
  { upTo: 50,  key: 'watch',  label: '关注' },
  { upTo: 75,  key: 'alert',  label: '警戒' },
  { upTo: 101, key: 'danger', label: '危险' },
];
function riskLevel(s) { return RISK_LEVELS.find(l => s < l.upTo) || RISK_LEVELS[3]; }
// Risk families for weighting: correlated items share one budget (no double counting)
const RISK_FAMILIES = [
  { id: 'margin', label: '强平风险', vars: ['margin_util', 'option_bp', 'margin_loan'] },

  { id: 'direction', label: '方向与亏损', vars: ['delta_exposure', 'gross_exposure', 'unrealized_loss'] },

/* ---------- helpers ---------- */
function _scoreMax(v, th) {           // higher value = riskier · th = [安全上限, 关注上限, 警戒上限]
  const [a, b, c] = th;
  if (v <= a) return a > 0 ? 25 * Math.max(0, v) / a : 0;
  if (v <= b) return 25 + 25 * (v - a) / (b - a);
  if (v <= c) return 50 + 25 * (v - b) / (c - b);
  return Math.min(100, 75 + 25 * (v - c) / (c - b));
}
function _scoreMin(v, th, worst = 0) {   // lower value = riskier · th = [安全下限, 关注下限, 警戒下限]
  const [a, b, c] = th;                    // worst = lowest possible value → scores exactly 100
  if (v >= a) return Math.max(0, 25 - 25 * (v - a) / a);
  if (v >= b) return 25 + 25 * (a - v) / (a - b);
  if (v >= c) return 50 + 25 * (b - v) / (b - c);
  return Math.min(100, 75 + 25 * (c - v) / Math.max(1e-9, c - worst));
}
function _balPick(bal, keys) {
  if (!bal) return null;
  for (const k of keys) if (typeof bal[k] === 'number' && isFinite(bal[k])) return bal[k];
  return null;
}
function _sumBalances(raw) {
  if (!Array.isArray(raw) || !raw.length) return null;
  const out = {};
  raw.forEach(b => Object.entries(b || {}).forEach(([k, v]) => {
    if (typeof v === 'number' && isFinite(v)) out[k] = (out[k] || 0) + v;
  }));
  return out;
}
function _isShortPos(x) { return x.kind === 'short_put' || x.kind === 'short_call'; }
function _daysTo(expiry) {
  const t = Date.parse(String(expiry) + 'T16:00:00');
  return isFinite(t) ? Math.round((t - Date.now()) / 86400000) : null;
}
function _dteOf(x) { return x.dte != null ? x.dte : (x.expiry ? _daysTo(x.expiry) : null); }
function _dollarDelta(x) {
  if (x.kind === 'stock') {
    const qty = Number(x.qty) || 0;
    const px = x.price != null ? x.price : (x.marketValue != null && qty ? Math.abs(x.marketValue) / qty : null);
    return px == null ? null : (x.side || 1) * qty * px;
  }
  if (x.delta == null || x.und == null) return null;
  return x.delta * 100 * (Number(x.qty) || 0) * x.und * (_isShortPos(x) ? -1 : 1);
}
function _posPnl(x) {
  if (x.marketValue == null || x.cost == null) return null;
  return _isShortPos(x) ? x.cost - Math.abs(x.marketValue) : x.marketValue - x.cost;
}
function _weekKey(expiry) {
  const d = new Date(String(expiry) + 'T12:00:00');
  if (!isFinite(d)) return null;
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // Monday of that week
  return d.toISOString().slice(0, 10);
}
function _expiryWeeks(list) {
  const m = {};
  list.forEach(x => {
    const k = _weekKey(x.expiry); if (!k) return;
    if (!m[k]) m[k] = { key: k, total: 0, count: 0, items: [] };
    m[k].total += x.exposure || 0; m[k].count++; m[k].items.push(x);
  });
  const md = s => { const d = new Date(s + 'T12:00:00'); return `${d.getMonth() + 1}/${d.getDate()}`; };
  return Object.values(m).map(w => {
    const dates = [...new Set(w.items.map(x => x.expiry))].sort();
    return { ...w, label: dates.length === 1 ? md(dates[0]) : `${md(dates[0])}–${md(dates[dates.length - 1])}` };
  });
}
function _needSchwab(c, what) {
  if (!c.isSchwab) return '未连接 Schwab';
  return c.p.workerVersion >= 2 ? `无报价${what} (${c.p.quotesStatus || '未知'})` : '需 Worker v2+';
}

function loadRiskWeights() {
  try { const o = JSON.parse(localStorage.getItem(RISK_WEIGHTS_KEY) || '{}'); return o && typeof o === 'object' ? o : {}; }
  catch (e) { return {}; }
}
function saveRiskWeights(o) { try { localStorage.setItem(RISK_WEIGHTS_KEY, JSON.stringify(o)); } catch (e) {} }
function _riskWeight(def, saved) {
  const v = saved[def.id];
  return typeof v === 'number' && isFinite(v) && v >= 0 ? v : def.w;
}

function computeRisk(p = getPortfolio()) {
  const r = portfolioRisk(p);
  const nav = p.nav && p.nav > 0 ? p.nav : null;
  const c = { p, r, nav, isSchwab: p.source === 'schwab', bal: p.balances || null, pos: p.positions || [],
              pctNav: v => (nav && v != null) ? v / nav * 100 : null };
  const saved = loadRiskWeights();
  const vars = RISK_VARS.map(def => {
    const w = _riskWeight(def, saved);
    let out;
    try { out = def.calc(c) || {}; } catch (e) { out = { unavailable: '计算出错' }; }
    if (out.na) return { def, w, available: false, na: out.na, hidden: !!out.hidden };
    if (out.unavailable) return { def, w, available: false, reason: out.unavailable };
    if (out.value == null || !isFinite(out.value)) return { def, w, available: false, reason: '数据不足' };
    let score = out.score != null ? out.score : def.dir === 'min' ? _scoreMin(out.value, def.th, def.worst || 0) : _scoreMax(out.value, def.th);
    if (out.scale != null && isFinite(out.scale)) score *= Math.max(0, Math.min(1, out.scale));
    const forced = out.force != null && out.force > score;
    if (forced) score = out.force;
    score = Math.max(0, Math.min(100, score));
    return { def, w, available: true, value: out.value, detail: out.detail || '', score, level: riskLevel(score), forced };
  });
  const used = vars.filter(v => v.available && v.w > 0);
  const wsum = used.reduce((s, v) => s + v.w, 0);
  const mean = wsum > 0 ? used.reduce((s, v) => s + v.w * v.score, 0) / wsum : null;   // plain weighted mean, for reference
  const cube = used.reduce((s, v) => s + v.w * v.score ** 3, 0);
  const composite = wsum > 0 ? Math.cbrt(cube / wsum) : null;                       // weighted power mean, p = 3
  // each item's share of the composite (shares of the cubed sum → they add up to the composite)
  used.forEach(v => { v.contrib = cube > 0 ? composite * (v.w * v.score ** 3) / cube : 0; });
  const top = used.slice().sort((a, b) => b.score - a.score)[0] || null;
  const danger = used.filter(v => v.level.key === 'danger').sort((a, b) => b.score - a.score);
  const applicable = vars.filter(v => !v.na && v.w > 0);
  const aw = applicable.reduce((s, v) => s + v.w, 0);
  return { c, vars, used, composite, mean, top, danger, coverage: aw > 0 ? wsum / aw : 0 };
}

/* ---------- formatting ---------- */
function _fmtRiskVal(v) {
  const d = v.def;
  if (d.unit === '%') return v.value.toFixed(1) + '%';
  if (d.unit === 'count') return String(Math.round(v.value)) + ' 张';
  if (d.unit === 'n') return v.value.toFixed(1);
  if (d.unit === 'phase') return ROC_PHASES[v.value] ? ROC_PHASES[v.value].short : '—';
  return String(v.value);
}
function _thLabel(def, x) {
  if (def.unit === '%') return x + '%';
  if (def.unit === 'count') return String(Math.ceil(x));
  return String(x);

/* ---------- analog gauge ---------- */
const __gaugeLast = {};

  const cx = 120, cy = 118, R = 96;
  const pt = (t, r) => { const a = Math.PI * (1 - t / 100); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
  const arc = (t0, t1, r) => {
    const [x0, y0] = pt(t0, r), [x1, y1] = pt(t1, r);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };

    .map(([a, b, k]) => `<path class="rg-zone rg-${k}" d="${arc(a + 0.7, b - 0.7, R)}"/>`).join('');
  let ticks = '';
  for (let t = 0; t <= 100; t += 5) {
    const major = t % 25 === 0;
    const [x0, y0] = pt(t, R - 13), [x1, y1] = pt(t, major ? R - 25 : R - 19);
    ticks += `<line class="rg-tick${major ? ' major' : ''}" x1="${x0.toFixed(2)}" y1="${y0.toFixed(2)}" x2="${x1.toFixed(2)}" y2="${y1.toFixed(2)}"/>`;
    if (major && !compact) { const [lx, ly] = pt(t, R - 37); ticks += `<text class="rg-tick-label" x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle">${t}</text>`; }
  }
  const has = score != null && isFinite(score);
  const s = has ? score : 0;
  const from = __gaugeLast[key] != null ? __gaugeLast[key] : 0;
  const lvl = has ? riskLevel(s) : null;
  const amp = (0.5 + 2.4 * s / 100).toFixed(2), dur = (4.6 - 3.0 * s / 100).toFixed(2);
  return `
    <svg class="rg-svg${compact ? ' rg-compact' : ''}" viewBox="0 0 240 ${compact ? 128 : 172}" role="img" aria-label="综合风险 ${has ? Math.round(s) : '暂无'}">
      <path class="rg-track" d="${arc(0, 100, R)}"/>
      ${zones}${ticks}
      <g class="rg-needle${has ? '' : ' rg-idle'}" data-key="${esc(key)}" data-score="${has ? s.toFixed(2) : ''}" style="transform: rotate(${_gaugeAngle(from)}deg)">
        <g class="rg-sway" style="--sway-amp:${amp}deg; --sway-dur:${dur}s">
          <line class="rg-needle-tail" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy + 16}"/>
          <line class="rg-needle-line" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - R + 18}"/>
          <circle class="rg-hub" cx="${cx}" cy="${cy}" r="7"/>
        </g>
      </g>
      ${compact ? '' : `<text class="rg-score${lvl ? ' rk-t-' + lvl.key : ''}" x="${cx}" y="${cy + 50}" text-anchor="middle">${has ? Math.round(s) : '—'}</text>`}
    </svg>`;
}
function animateRiskGauges() {

    const s = parseFloat(raw), key = el.dataset.key;

      const px = x.price != null ? x.price : (x.marketValue != null && qty ? Math.abs(x.marketValue) / qty : null);
      if (px == null) { skipped++; return; }

    }
    const S = x.und;
    if (S == null) { skipped++; return; }

const SCHWAB_CLOSED_KEY = 'pretrade_schwab_closed';

  try {
    const res = await fetch(cfg.url.replace(/\/+$/, '') + '/closed', { headers: { Authorization: 'Bearer ' + cfg.token }, cache: 'no-store' });
    const body = await res.json().catch(() => null);
    if (res.ok && body && Array.isArray(body.lots)) {
      const nc = { data: body, fetchedAt: Date.now() };
      try { localStorage.setItem(SCHWAB_CLOSED_KEY, JSON.stringify(nc)); } catch (e) {}
      return { cache: nc, fetched: true };

  const lab = d => { const x = new Date(today.getTime() + d * 864e5); return `${x.getMonth() + 1}/${x.getDate()}`; };
  const bars = cal.days.map(d => `
    ${d.sell > 0 ? `<rect x="${(Xc(d.d) - bw * 0.38).toFixed(1)}" y="${Y(d.sell).toFixed(1)}" width="${(bw * 0.76).toFixed(1)}" height="${(Y(0) - Y(d.sell)).toFixed(1)}" class="gl-bar-sell"><title>${lab(d.d)} 卖方 ${_fmtSigned(d.sell)}</title></rect>` : ''}
    ${d.buy < 0 ? `<rect x="${(Xc(d.d) - bw * 0.38).toFixed(1)}" y="${Y(0).toFixed(1)}" width="${(bw * 0.76).toFixed(1)}" height="${(Y(d.buy) - Y(0)).toFixed(1)}" class="gl-bar-buy"><title>${lab(d.d)} 买方 ${_fmtSigned(d.buy)}</title></rect>` : ''}`).join('');
  const line = cal.days.map(d => `${Xc(d.d).toFixed(1)},${Yc(d.cum).toFixed(1)}`).join(' ');
  const step = Math.max(1, Math.ceil(n / Math.max(3, Math.floor((W - L - R) / 52))));
  const xl = cal.days.filter(d => d.d % step === 0).map(d => `<text x="${Xc(d.d).toFixed(1)}" y="${H - B + 12}" text-anchor="middle" class="gl-lab">${lab(d.d)}</text>`).join('');
  const byDay = {}; cal.expiries.forEach(e => { (byDay[e.d] = byDay[e.d] || []).push(e); });
  const ex = Object.entries(byDay).map(([d, es]) => `<g class="gl-exp"><line x1="${Xc(+d).toFixed(1)}" x2="${Xc(+d).toFixed(1)}" y1="${T}" y2="${H - B}"/>`
    + es.map((e, k) => `<text x="${Xc(+d).toFixed(1)}" y="${H - 5 - (es.length - 1 - k) * 12}" text-anchor="middle" class="${e.short ? '' : 'long'}">${esc(e.label)}</text>`).join('') + '</g>').join('');
  return `<svg class="rk-chart gl-cal" viewBox="0 0 ${W} ${H}" role="img" aria-label="Theta 日历">
    <line x1="${L}" x2="${W - R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" class="rk-ch-grid zero"/>
    <text x="${L - 6}" y="${(Y(maxBar * 0.95) + 3).toFixed(1)}" text-anchor="end" class="gl-lab">${_fmtSigned(maxBar)}</text>
    <text x="${L - 6}" y="${(Y(-maxBar * 0.95) + 3).toFixed(1)}" text-anchor="end" class="gl-lab">${_fmtSigned(-maxBar)}</text>
    <text x="${W - R + 6}" y="${(Yc(cmax) + 8).toFixed(1)}" class="gl-lab gl-cum-lab">${_fmtSigned(cmax)}</text>
    ${ex}${bars}<polyline points="${line}" class="gl-cum"/>${xl}
  </svg>`;
}
function _thetaScatterSVG(pos) {
  const pts = pos.filter(_isShortPos).map(x => {
    const m = _optModel(x); if (!m) return null;
    const g = bsGreeks(m.S, m.K, m.T, m.sigma, m.type, BS_RATE, m.q);
    const th = (x.theta != null ? x.theta : g.theta) * 100 * m.qty * -1;
    const coll = (m.type === 'put' ? m.K : m.S) * 100 * m.qty;
    return { x, m, p: g.pITM * 100, y: th * 365 / coll * 100, coll, th };
  }).filter(Boolean);
  if (pts.length < 1) return '';
  const W = _chartW(), H = 230, L = 46, R = 14, T = 14, B = 32;
  const xmax = Math.max(50, ...pts.map(p => p.p)) * 1.05, ymax = Math.max(10, ...pts.map(p => p.y)) * 1.15;
  const X = v => L + v / xmax * (W - L - R), Y = v => T + (ymax - v) / ymax * (H - T - B);
  const cmax = Math.max(...pts.map(p => p.coll));
  const dcls = d => d <= 7 ? 'danger' : d <= 21 ? 'watch' : 'safe';
  const gx = [0, 10, 20, 30, 40, 50, 60, 70, 80].filter(v => v <= xmax).filter((v, i, a) => W >= 480 || i % 2 === 0 || i === a.length - 1), gy = [0, ymax / 3, ymax * 2 / 3].map(v => Math.round(v));
  return `<svg class="rk-chart gl-scatter" viewBox="0 0 ${W} ${H}" role="img" aria-label="Theta 效率">
    ${gy.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="rk-ch-grid${v === 0 ? ' zero' : ''}"/><text x="${L - 6}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end" class="gl-lab">${v}%</text>`).join('')}
    ${gx.map(v => `<text x="${X(v).toFixed(1)}" y="${H - 12}" text-anchor="middle" class="gl-lab">${v}%</text>`).join('')}
    <text x="${W - R}" y="${(Y(0) - 6).toFixed(1)}" text-anchor="end" class="gl-lab">价内概率 →</text>
    <text x="${L + 4}" y="${T + 9}" class="gl-lab">↑ 年化 Theta / 保证金</text>
    ${(() => { const placed = []; pts.slice().sort((a, b) => a.p - b.p).forEach(p => {
        const r = 5 + 13 * Math.sqrt(p.coll / cmax), w = p.x.ticker.length * 7 + 4, x = X(p.p);
        let y = Y(p.y) - r - 3;
        for (let k = 0; k < 6 && placed.some(q => Math.abs(q.x - x) < (q.w + w) / 2 && Math.abs(q.y - y) < 12); k++) y -= 12;
        placed.push({ x, y, w }); p._ly = y; });
      return ''; })()}
    ${pts.map(p => {
      const r = 5 + 13 * Math.sqrt(p.coll / cmax), idx = pos.indexOf(p.x);
      return `<g class="gl-dot gl-${dcls(p.m.dte)}" role="button" tabindex="0" onclick="openOptionLab(${idx})" onkeydown="if(event.key==='Enter')openOptionLab(${idx})">
        <circle cx="${X(p.p).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${r.toFixed(1)}"/>
        <text x="${X(p.p).toFixed(1)}" y="${p._ly.toFixed(1)}" text-anchor="middle">${esc(p.x.ticker)}</text>
        <title>${esc(_posLabel(p.x))} · 价内概率 ${p.p.toFixed(0)}% · 年化 ${p.y.toFixed(1)}% · ${_fmtSigned(p.th)}/天</title></g>`;
    }).join('')}
  </svg>`;
}

/* ---------- LEAPS efficiency ---------- */
function _leapsStats(x) {
  const m = _optModel(x); if (!m || m.type !== 'call') return null;
  const g = bsGreeks(m.S, m.K, m.T, m.sigma, 'call', BS_RATE, m.q);
  const delta = x.delta != null ? x.delta : g.delta, theta = x.theta != null ? x.theta : g.theta, vega = x.vega != null ? x.vega : g.vega;
  const mark = m.mark != null ? m.mark : g.price;
  const intr = Math.max(0, m.S - m.K), extr = Math.max(0, mark - intr);
  const yrs = Math.max(1 / 365, m.T);
  return {
    m, g, delta, mark, intr, extr,
    shares: delta * 100 * m.qty, usd: delta * 100 * m.qty * m.S,
    lambda: mark > 0 ? delta * m.S / mark : null,
    extrPct: mark > 0 ? extr / mark * 100 : null,
    carry: extr / m.K / yrs * 100,                       // annualized time value as a financing rate on the strike
    thetaMonth: theta * 100 * m.qty * 30, vegaUsd: vega * 100 * m.qty,
    be: m.K + mark, beMove: (m.K + mark - m.S) / m.S * 100,      // expiry breakeven (kept for reference)
    dPer1: g.gamma * m.S * 0.01 * 100 * m.qty,           // share-delta gained per +1% move
    value: mark * 100 * m.qty,
  };
}
function _leapsLabHTML(R) {
  if (!R.c.isSchwab) return '';
  const rows = R.c.pos.map((x, i) => ({ x, i, s: x.kind === 'leaps' ? _leapsStats(x) : null })).filter(o => o.x.kind === 'leaps');
  if (!rows.length) return '';
  const ok = rows.filter(o => o.s);
  const sum = k => ok.reduce((a, o) => a + (o.s[k] || 0), 0);
  const val = sum('value'), usd = sum('usd'), extr = ok.reduce((a, o) => a + o.s.extr * 100 * o.s.m.qty, 0);
  const carryW = ok.reduce((a, o) => a + o.s.carry * o.s.m.K * o.s.m.qty, 0) / (ok.reduce((a, o) => a + o.s.m.K * o.s.m.qty, 0) || 1);
  const fig = (label, v, sub, cls = 'rk-t-acc') => `<div class="rk-fig"><span class="rk-fig-val ${cls}">${v}</span><span class="rk-fig-label">${label}</span>${sub ? `<span class="rk-fig-sub">${sub}</span>` : ''}</div>`;
  const dcls = d => d < 0.6 ? 'rk-t-alert' : d > 0.92 ? 'rk-t-watch' : 'rk-t-safe';
  return `
    <section class="rk-block">
      <h3 class="rk-block-title">LEAPS</h3>
      ${ok.length ? `<div class="rk-figs">
        ${fig('正股等值', _fmtUsd(usd), `${Math.round(sum('shares')).toLocaleString()} 股`)}
        ${fig('杠杆 λ', val > 0 ? (usd / val).toFixed(2) + '×' : '—', `市值 ${_fmtUsd(val)}`)}
        ${fig('时间价值', _fmtUsd(extr), `${carryW.toFixed(1)}%/年`, 'rk-t-watch')}
        ${fig('Theta/月', _fmtSigned(sum('thetaMonth')), `Vega ${_fmtSigned(sum('vegaUsd'))}/点`, sum('thetaMonth') >= 0 ? 'rk-t-safe' : 'rk-t-alert')}
      </div>` : ''}
      <div class="rk-table-wrap"><table class="rk-table gl-leaps">
        <thead><tr><th>合约</th><th>Δ</th><th>股数</th><th>λ ${_qBtn('lambda', 'long')}</th><th>时间价值</th><th>时间价值/年 ${_qBtn('carry', 'long')}</th><th>浮盈</th><th>Theta/月</th><th>Vega/点</th><th>DTE</th></tr></thead>
        <tbody>${rows.map(({ x, i, s }) => s ? `
          <tr class="gl-row" role="button" tabindex="0" onclick="openOptionLab(${i})" onkeydown="if(event.key==='Enter')openOptionLab(${i})">
            <td>${esc(_posLabel(x))}</td><td class="${dcls(s.delta)}">${s.delta.toFixed(2)}</td><td>${Math.round(s.shares)}</td>
            <td>${s.lambda != null ? s.lambda.toFixed(2) + '×' : '—'}</td><td>${s.extrPct != null ? s.extrPct.toFixed(0) + '%' : '—'}</td>
            <td>${s.carry.toFixed(1)}%</td>
            <td>${(() => { const rr = _leapsReturn(x, s.mark); return rr ? `<span class="${rr.ret >= 0 ? 'rk-t-safe' : 'rk-t-alert'}">${rr.ret >= 0 ? '+' : ''}${rr.ret.toFixed(0)}%</span> <span class="rk-quiet">${rr.ann != null ? (rr.ann >= 0 ? '+' : '') + rr.ann.toFixed(0) + '%/年' : '—'}</span>` : '—'; })()}</td>
            <td class="${_thCls(s.thetaMonth)}">${_fmtSigned(s.thetaMonth)}</td><td>${_fmtSigned(s.vegaUsd)}</td><td>${s.m.dte}</td></tr>`
          : `<tr><td>${esc(_posLabel(x))}</td><td colspan="9" class="rk-quiet">缺报价</td></tr>`).join('')}</tbody>
      </table></div>
      <div class="rk-note">时间价值/年 是成本 (可对比融资利率), 不是收益; 年化收益按对应 checklist 快照的开仓日计算. Δ &lt; 0.60 橙色. 点合约看止盈 / 止损先到概率.</div>
    </section>`;
}

/* ---------- per-contract lab (modal) ---------- */
function _probBeyond(m, X, above) {          // risk-neutral P(S_T > X) or P(S_T < X)
  if (!(m.T > 0)) return (above ? m.S > X : m.S < X) ? 1 : 0;
  const d2 = (Math.log(m.S / X) + (BS_RATE - m.q - m.sigma * m.sigma / 2) * m.T) / (m.sigma * Math.sqrt(m.T));
  return above ? _ncdf(d2) : _ncdf(-d2);
}
function _optionLabBodyHTML(x, posIdx = -1) {
  const m = _optModel(x);
  if (!m) return `<div class="rk-quiet">缺报价 (现价 / 市价或 IV / 到期日), 无法建模.</div>`;
  const g = bsGreeks(m.S, m.K, m.T, m.sigma, m.type, BS_RATE, m.q);
  const short = _isShortPos(x), mu = Math.abs(m.mult), ctx = short ? 'short' : 'long';
  const isLeaps = !short && m.type === 'call';
  const entry = x.avg != null ? x.avg : (m.mark != null ? m.mark : g.price);
  const tg = isLeaps ? _leapsTargetFor(x) : null;
  const lx = isLeaps ? _leapsExitStats(m, entry, tg.pct) : null;
  const useExit = isLeaps && lx.exitD > 0;
  const H = useExit ? lx.exitD : m.dte, half = Math.round(H / 2);
  const Hlabel = useExit ? '退出日' : '到期';
  const be = m.type === 'put' ? m.K - entry : m.K + entry;
  const pop = _probBeyond(m, be, m.type === 'put' ? short : !short);
  const sd = useExit ? lx.sd : m.S * m.sigma * Math.sqrt(Math.max(m.T, 1 / 365));
  const n = 41, xsP = []; for (let k = 0; k < n; k++) xsP.push(m.S * (0.7 + 0.6 * k / (n - 1)));
  const G = (S1, d, dv = 0) => bsGreeks(S1, m.K, Math.max(0, m.T - d / 365), Math.max(0.01, m.sigma + dv / 100), m.type, BS_RATE, m.q);
  const pnlAt = (S1, days) => (G(S1, days).price - entry) * m.mult;
  const payoff = _lineChartSVG({ xs: xsP, w: _chartW(), h: 220, marker: m.S, markerLabel: `现价 ${m.S.toFixed(2)}`, xFmt: v => v.toFixed(0), yFmt: _fmtK, tipFmt: _fmtSigned,
    band: [m.S - sd, m.S + sd, '±1σ'],
    vlines: [{ x: m.S - 2 * sd, cls: 'sd2' }, { x: m.S + 2 * sd, cls: 'sd2' }, { x: useExit ? lx.be : be, cls: 'be' }].filter(l => l.x != null),
    series: [{ ys: xsP.map(S1 => pnlAt(S1, 0)), cls: 'gl-l1', label: '今天' }, { ys: xsP.map(S1 => pnlAt(S1, half)), cls: 'gl-l2', label: `${half} 天后` }, { ys: xsP.map(S1 => pnlAt(S1, H)), cls: 'gl-l3', label: Hlabel }] });
  const fnFor = (k, S1, d) => {
    if (k === 'charm') return (G(S1, d + 1).delta - G(S1, d).delta) * m.mult;
    if (k === 'vanna') return (G(S1, d, 0.5).delta - G(S1, d, -0.5).delta) * m.mult;
    return G(S1, d)[k] * m.mult;
  };
  const panel = surfacePanelHTML({ metrics: S_METRICS, build: k => optionSurface(m, entry, k, H), height: 320 });
  const stat = (l, v, cls, q) => `<div class="gl-stat"><span>${l}${q ? ' ' + _qBtn(q, ctx) : ''}</span><b class="${cls || ''}">${v}</b></div>`;
  const dl = x.delta != null ? x.delta : g.delta, th = x.theta != null ? x.theta : g.theta, vg = x.vega != null ? x.vega : g.vega, gm = x.gamma != null ? x.gamma : g.gamma;
  const dist = _distPct(x), cap = _captured(x);
  const coll = (m.type === 'put' ? m.K : m.S) * mu;
  const pc = v => (v * 100).toFixed(0) + '%';
  let extra = [];
  if (short) extra = [
    stat('盈亏平衡', `${be.toFixed(2)} (${((be - m.S) / m.S * 100) >= 0 ? '+' : ''}${((be - m.S) / m.S * 100).toFixed(1)}%)`),
    stat('盈利概率', pc(pop), pop < 0.5 ? 'rk-t-alert' : 'rk-t-safe'),
    stat('价内概率', pc(g.pITM), g.pITM > 0.35 ? 'rk-t-alert' : ''),
    stat('±1σ', `${(m.S - sd).toFixed(0)} – ${(m.S + sd).toFixed(0)}`),
    stat('已赚', cap != null ? cap.toFixed(0) + '%' : '—'),
    stat('年化权利金', entry > 0 ? (entry * mu / coll * 365 / Math.max(1, m.dte) * 100).toFixed(1) + '%' : '—'),
    stat('年化 Theta', (-th * mu * 365 / coll * 100).toFixed(1) + '%'),
  ];
  else if (isLeaps) {
    const s = _leapsStats(x) || {}, rr = _leapsReturn(x, m.mark != null ? m.mark : g.price);
    extra = useExit ? [
      stat(`止盈 +${lx.tgtPct}% 先到`, lx.already === 'target' ? '已达到' : pc(lx.pTarget), 'rk-t-safe'),
      stat(`止损 −${lx.stopPct}% 先到`, lx.already === 'stop' ? '已触发' : pc(lx.pStop), lx.pStop > 0.3 ? 'rk-t-danger' : ''),
      stat('退出时盈利', pc(lx.pProfitExit), lx.pProfitExit < 0.5 ? 'rk-t-alert' : 'rk-t-safe'),
      stat('盈亏平衡', lx.be != null ? `${lx.be.toFixed(2)} (${((lx.be - m.S) / m.S * 100) >= 0 ? '+' : ''}${((lx.be - m.S) / m.S * 100).toFixed(1)}%)` : '—'),
      stat('±1σ', `${(m.S - sd).toFixed(0)} – ${(m.S + sd).toFixed(0)}`),
      stat('距退出', `${lx.exitD} 天`),
    ] : [stat('退出', `已进入 6 个月退出区`, 'rk-t-danger')];
    extra.push(
      stat('杠杆 λ', s.lambda != null ? s.lambda.toFixed(2) + '×' : '—', '', 'lambda'),
      stat('时间价值', s.extrPct != null ? s.extrPct.toFixed(0) + '%' : '—'),
      stat('时间价值/年', s.carry != null ? s.carry.toFixed(1) + '%' : '—', '', 'carry'),
      stat('浮盈', rr ? `${rr.ret >= 0 ? '+' : ''}${rr.ret.toFixed(0)}%${rr.ann != null ? ` · ${rr.ann >= 0 ? '+' : ''}${rr.ann.toFixed(0)}%/年` : ''}` : '—', rr && rr.ret >= 0 ? 'rk-t-safe' : 'rk-t-alert'),
      stat('+1% Δ 变化', s.dPer1 != null ? '+' + s.dPer1.toFixed(1) + ' 股' : '—'));
  } else extra = [
    stat('盈亏平衡', `${be.toFixed(2)}`), stat('盈利概率', pc(pop)), stat('±1σ', `${(m.S - sd).toFixed(0)} – ${(m.S + sd).toFixed(0)}`)];
  return `
    <div class="gl-stats">
      ${stat('现价', m.S.toFixed(2))}${stat('行权价', m.K)}${stat('DTE', m.dte)}
      ${stat('IV', (m.sigma * 100).toFixed(1) + '%' + (m.schwabIv && Math.abs(m.schwabIv - m.sigma) > 0.05 ? ` <span class="rk-quiet">Schwab ${(m.schwabIv * 100).toFixed(1)}%</span>` : ''))}
      ${stat('市价', m.mark != null ? m.mark.toFixed(2) : g.price.toFixed(2) + ' (模型)')}${m.q > 0 ? stat('隐含股息率', (m.q * 100).toFixed(2) + '%' + (m.q > 0.08 ? ' · 市价可能过时' : ''), m.q > 0.08 ? 'rk-t-alert' : '') : ''}
      ${stat('距行权价', dist == null ? '—' : dist < 0 ? '价内 ' + Math.abs(dist).toFixed(1) + '%' : dist.toFixed(1) + '%', dist != null && dist < 0 ? (short ? 'rk-t-danger' : 'rk-t-safe') : '')}
      ${stat('Δ', (dl * m.sign).toFixed(2) + ` · ${Math.round(dl * m.mult)} 股`, '', 'delta')}${stat('Γ', gm.toFixed(4), '', 'gamma')}
      ${stat('Θ / 天', _fmtSigned(th * m.mult), '', 'theta')}${stat('Vega / 点', _fmtSigned(vg * m.mult), '', 'vega')}
      ${extra.join('')}
    </div>
    <div class="rk-sub-title">盈亏曲线</div>
    ${payoff}
    <div class="rk-legend"><span><i class="rk-sw gl-sw-l1"></i>今天</span><span><i class="rk-sw gl-sw-l2"></i>${half} 天后</span><span><i class="rk-sw gl-sw-l3"></i>${Hlabel}${useExit ? ' (DTE 180)' : ''}</span><span><i class="rk-sw gl-sw-band"></i>±1σ</span><span class="rk-legend-note">虚线 ±2σ · 点线 ${useExit ? '退出日' : ''}盈亏平衡 · 相对开仓价 ${entry.toFixed(2)}</span></div>
    <div class="rk-sub-title">曲面</div>
    ${panel}
    <div class="rk-sub-title">Greeks</div>
    ${_greekGridHTML(fnFor, half, ctx, xsP, m.S)}
    ${_rollBlockHTML(x, posIdx)}
    <div class="rk-legend"><span><i class="rk-sw gl-sw-l1"></i>今天</span><span><i class="rk-sw gl-sw-l2"></i>${half} 天后</span><span class="rk-legend-note">悬停 / 点按看数值 · 竖虚线 = 现价 · Black-Scholes-Merton · r 4% · ${m.q > 0 ? `股息率 ${(m.q * 100).toFixed(2)}% (由市价反推) · IV ${m.ivSrc}` : `IV 按${m.ivSrc}校准`} · 概率为风险中性${isLeaps ? ' · 先到概率为 2000 条路径模拟' : ''}</span></div>`;

/* FIFO lot matching over normalized transactions */
function buildPerfLots(txs) {
  const open = {}, stockOpen = {}, closed = [], flows = [], income = [];
  const assignEvents = [];
  const isAssign = t => /ASSIGN|EXERCIS/i.test(t.desc || '') || t.items.some(i => /ASSIGN|EXERCIS/i.test(i.desc || ''));
  txs.forEach(t => {
    if (FLOW_TYPES.includes(t.type)) { if (t.net) flows.push({ ts: t.ts, amt: t.net }); return; }
    if (t.type === 'DIVIDEND_OR_INTEREST') { if (t.net) income.push({ ts: t.ts, amt: t.net, desc: t.desc }); return; }
    const opts = t.items.filter(i => i.asset === 'OPTION'), eqs = t.items.filter(i => i.asset === 'EQUITY' || i.asset === 'COLLECTIVE_INVESTMENT');
    const multi = opts.length > 1;
    opts.forEach(i => {
      const qty = Math.abs(i.amount || 0); if (!qty) return;
      const key = i.symbol, q = open[key] || (open[key] = []);
      if (t.type === 'RECEIVE_AND_DELIVER') {
        const method = isAssign(t) ? 'assigned' : 'expired';
        _consume(q, qty, 0, t.ts, closed, i, method);
        if (method === 'assigned') assignEvents.push({ ts: t.ts, ticker: i.ticker, strike: i.strike, putCall: i.putCall, qty });
        return;
      }
      const cash = multi ? (i.cost ?? 0) : (t.net ?? i.cost ?? 0);
      if (i.effect === 'CLOSING' || (i.effect == null && q.length)) _consume(q, qty, cash, t.ts, closed, i, 'trade');
      else q.push({ qty, cash, ts: t.ts, side: cash > 0 ? 'short' : 'long', multi, item: i });
    });
    eqs.forEach(i => {
      const qty = Math.abs(i.amount || 0); if (!qty || !i.ticker) return;
      const cash = eqs.length === 1 && !opts.length ? (t.net ?? i.cost ?? 0) : (i.cost ?? (i.price != null ? -Math.sign(i.amount || 1) * i.price * qty : 0));
      const q = stockOpen[i.ticker] || (stockOpen[i.ticker] = []);
      const buy = cash < 0 || (cash === 0 && (i.amount || 0) > 0) || (t.type === 'RECEIVE_AND_DELIVER' && (i.amount || 0) > 0);
      if (buy) {
        const fromAssign = assignEvents.find(a => a.ticker === i.ticker && Math.abs(a.ts - t.ts) < 4 * 86400000 && !a.used);
        if (fromAssign) fromAssign.used = true;

          if (lot.assign) lot.assign.stockPnl = (lot.assign.stockPnl || 0) + (per - lot.per) * k, lot.assign.sold = (lot.assign.sold || 0) + k;

function _consume(q, qty, cash, ts, closed, item, method) {

      openTs: lot.ts, closeTs: ts, openCash: openPart, pnl: openPart + closePart, method, strategy,

/* ---------- wheel cost basis: premiums lower the real cost of shares held ---------- */
function computeWheel() {
  const h = loadHist(); if (!h) return null;
  const { closed } = buildPerfLots(h.data);
  const pos = getPortfolio().positions;
  const held = pos.filter(x => x.kind === 'stock' && (x.side || 1) > 0 && (Number(x.qty) || 0) > 0);
  if (!held.length) return { rows: [] };
  const txs = h.data.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const isAssign = t => /ASSIGN|EXERCIS/i.test(t.desc || '');
  const rows = held.map(sx => {
    const T = sx.ticker, ev = [];
    txs.forEach(t => {
      const opts = t.items.filter(i => i.asset === 'OPTION' && i.ticker === T), eqs = t.items.filter(i => (i.asset === 'EQUITY' || i.asset === 'COLLECTIVE_INVESTMENT') && i.ticker === T);
      const allOpts = t.items.filter(i => i.asset === 'OPTION'), allEq = t.items.filter(i => i.asset === 'EQUITY' || i.asset === 'COLLECTIVE_INVESTMENT');
      opts.forEach(i => {
        if (t.type === 'RECEIVE_AND_DELIVER') { ev.push({ ts: t.ts, kind: isAssign(t) ? 'opt_assigned' : 'opt_expired', i, cash: 0 }); return; }
        const cash = allOpts.length === 1 && !allEq.length ? (t.net ?? i.cost ?? 0) : (i.cost ?? 0);
        ev.push({ ts: t.ts, kind: 'opt', i, cash, open: i.effect === 'OPENING' || (i.effect == null && cash > 0) });
      });
      eqs.forEach(i => {
        const qty = Math.abs(i.amount || 0); if (!qty) return;
        let cash = allEq.length === 1 && !allOpts.length ? (t.net ?? i.cost ?? 0) : (i.cost ?? 0);
        const buy = cash < 0 || (cash === 0 && (i.amount || 0) > 0) || (t.type === 'RECEIVE_AND_DELIVER' && (i.amount || 0) > 0);
        if (t.type === 'RECEIVE_AND_DELIVER' || !cash) {        // assignment / call-away: priced at the strike
          const k = closed.find(l => l.ticker === T && l.method === 'assigned' && Math.abs((l.closeTs || 0) - t.ts) < 4 * 86400000);
          const px = k ? k.strike : (i.price || 0);
          cash = (buy ? -1 : 1) * px * qty;
        }
        ev.push({ ts: t.ts, kind: buy ? 'buy' : 'sell', qty, cash, assigned: t.type === 'RECEIVE_AND_DELIVER' });
      });
    });
    // walk shares; keep the last cycle that started at 0
    let shares = 0, cyc = null, opening = false;
    ev.forEach(e => {
      if (e.kind === 'buy') {
        if (shares <= 0) {
          cyc = { start: e.ts, ev: [], buyCost: 0, bought: 0, sold: 0, sells: 0, prem: 0 };
          const k = closed.filter(l => l.ticker === T && l.putCall === 'PUT' && l.method === 'assigned' && Math.abs((l.closeTs || 0) - e.ts) < 4 * 86400000);
          k.forEach(l => { cyc.prem += l.openCash; cyc.ev.push({ ts: l.closeTs, kind: 'csp', label: `${l.strike}P 被行权 · 权利金`, cash: l.openCash }); });
        }
        shares += e.qty; cyc.buyCost += -e.cash; cyc.bought += e.qty;
        cyc.ev.push({ ts: e.ts, kind: 'buy', label: `${e.assigned ? '接股' : '买入'} ${e.qty} 股 @ ${(-e.cash / e.qty).toFixed(2)}`, cash: e.cash });
      } else if (e.kind === 'sell') {
        shares -= e.qty;
        if (cyc) { cyc.sells += e.cash; cyc.sold += e.qty; cyc.ev.push({ ts: e.ts, kind: 'sell', label: `${e.assigned ? '被行权卖出' : '卖出'} ${e.qty} 股 @ ${(e.cash / e.qty).toFixed(2)}`, cash: e.cash }); }
        if (shares <= 0) { cyc = null; shares = 0; }
      } else if (cyc && shares > 0 && e.kind === 'opt') {
        const i = e.i, tag = `${i.strike}${i.putCall === 'PUT' ? 'P' : 'C'} ${_md(i.expiry)}`;
        cyc.prem += e.cash;
        cyc.ev.push({ ts: e.ts, kind: 'opt', label: `${e.cash >= 0 ? '卖出' : '买回'} ${tag} × ${Math.abs(i.amount || 0)}`, cash: e.cash });
      } else if (cyc && shares > 0 && e.kind === 'opt_expired') {
        const i = e.i; cyc.ev.push({ ts: e.ts, kind: 'exp', label: `${i.strike}${i.putCall === 'PUT' ? 'P' : 'C'} ${_md(i.expiry)} 到期作废`, cash: 0 });
      }
    });
    const sh = Number(sx.qty) || 0, px = _stockPx(sx), schwabAvg = sx.avg;
    if (!cyc || Math.abs(shares - sh) > 0.5) {
      // holding predates the record window (or counts disagree): start from Schwab's average, add every premium on record
      const prem = ev.filter(e => e.kind === 'opt').reduce((s, e) => s + e.cash, 0);
      const base = (schwabAvg || 0) * sh;
      const adj = sh ? (base - prem) / sh : null;
      return { T, shares: sh, px, schwabAvg, buyAvg: schwabAvg, prem, adj, partial: true, cycleStart: null, events: ev.filter(e => e.kind === 'opt').map(e => ({ ts: e.ts, label: `${e.cash >= 0 ? '卖出' : '买回'} ${e.i.strike}${e.i.putCall === 'PUT' ? 'P' : 'C'} ${_md(e.i.expiry)}`, cash: e.cash })) };
    }
    const net = cyc.buyCost - cyc.sells - cyc.prem;
    return { T, shares: sh, px, schwabAvg, buyAvg: cyc.bought ? cyc.buyCost / cyc.bought : null, prem: cyc.prem, sells: cyc.sells, adj: net / sh, partial: false, cycleStart: cyc.start, events: cyc.ev };
  });
  return { rows: rows.sort((a, b) => (b.prem || 0) - (a.prem || 0)) };
}

            ${r.events.map(e => `<tr class="rk-dd-row"><td>${dt(e.ts)}</td><td colspan="5">${esc(e.label)}</td><td colspan="2" class="${_thCls(e.cash)}">${e.cash ? _fmtSigned(e.cash) : '—'}</td></tr>`).join('')}
            <tr class="rk-dd-row"><td></td><td colspan="7" class="rk-quiet">Schwab 均价 ${f2(r.schwabAvg)}${r.cycleStart ? ` · 本轮自 ${dt(r.cycleStart)} 起` : ''}</td></tr>
          </tbody>`; }).join('')}
      </table></div>
      <div class="rk-note">调整后成本 = (买入总成本 − 卖出回款 − 净权利金) ÷ 当前股数. 本轮从持股由 0 变为正数起算, 含被行权那张 CSP 的权利金及之后所有期权收付 (含未平仓 call 已收的权利金). 买入价按行权价计; Schwab 均价通常已按税务规则扣除 put 权利金, 仅供对照. 起点早于 2 年记录的, 以 Schwab 均价为起点.</div>
    </section>`;
}

/* ---------- fault isolation: one broken block never takes the page down ---------- */
const LAST_ERR_KEY = 'pretrade_last_error';
function _reportErr(where, e) {
  const msg = (e && (e.message || e.reason && e.reason.message)) || String(e);
  const stack = String((e && e.stack) || '').split('\n').slice(0, 3).map(s => s.trim()).join(' | ');
  try { localStorage.setItem(LAST_ERR_KEY, JSON.stringify({ where, msg, stack, at: Date.now(), build: APP_BUILD })); } catch (er) {}
  try { console.error('[checklist]', where, e); } catch (er) {}
  const now = Date.now();
  if (typeof showToast === 'function' && now - (_reportErr._t || 0) > 4000) { _reportErr._t = now; showToast('出错: ' + where, 'error', String(msg).slice(0, 120)); }
}
window.addEventListener('error', e => _reportErr('页面', e.error || e.message));
window.addEventListener('unhandledrejection', e => _reportErr('后台', e.reason));
function _safe(label, fn, fallback) {
  try { return fn(); }
  catch (e) { _reportErr(label, e); return fallback !== undefined ? fallback : `<section class="rk-block rk-err"><b>${esc(label)}</b> 出错: ${esc(String(e && e.message || e).slice(0, 160))}</section>`; }
}
// Rebuildable caches only. Inputs, snapshots, settings and both connections are never touched.
const CACHE_KEYS = ['pretrade_schwab_cache', 'pretrade_schwab_closed', 'pretrade_betas', 'pretrade_crisis', 'pretrade_history_tx',
  'pretrade_navseries', 'pretrade_last_error', 'pretrade_watchlist', 'pretrade_panel_collapse'];
function _sanitizeRiskHist() {
  // device-only trend: keep every well-formed day, drop anything malformed
  let kept = 0, dropped = 0;
  try {
    const raw = JSON.parse(localStorage.getItem('pretrade_risk_hist') || '[]');
    const ok = (Array.isArray(raw) ? raw : []).filter(e => {
      const good = e && typeof e === 'object' && /^\d{4}-\d{2}-\d{2}$/.test(String(e.d)) && isFinite(e.s) && e.s >= 0 && e.s <= 100;
      if (!good) dropped++;
      return good;
    }).map(e => ({ d: e.d, s: +e.s, v: e.v && typeof e.v === 'object' && !Array.isArray(e.v)
      ? Object.fromEntries(Object.entries(e.v).filter(([, x]) => isFinite(x)).map(([k, x]) => [k, +x])) : {} }));
    kept = ok.length;
    localStorage.setItem('pretrade_risk_hist', JSON.stringify(ok));
  } catch (e) { try { localStorage.removeItem('pretrade_risk_hist'); } catch (er) {} }
  return { kept, dropped };
}
window.clearCaches = () => {
  if (!confirm('清理缓存?\n\n清除: Schwab 持仓缓存、平仓记录、β、历史危机、交易记录、净值曲线 (会自动重新下载).\n保留: snapshot 记录、所有设置、Sync 和 Schwab 连接, 无需重新输入.\n\n页面会重新加载.')) return;
  const before = CACHE_KEYS.filter(k => { try { return localStorage.getItem(k) != null; } catch (e) { return false; } }).length;
  CACHE_KEYS.forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  const h = _sanitizeRiskHist();
  try { sessionStorage.setItem('pretrade_cleared', JSON.stringify({ n: before, dropped: h.dropped })); } catch (e) {}
  location.reload();
};

function _riskDecompHTML(R) {
  if (R.composite == null || !R.used.length) return '';
  const parts = R.used.slice().sort((a, b) => b.contrib - a.contrib);
  const sum = parts.reduce((s, v) => s + v.contrib, 0) || 1;
  return `
    <section class="rk-decomp">
      <div class="rk-decomp-bar">${parts.map(v => `<i class="rk-f-${v.level.key}" style="width:${(v.contrib / sum * 100).toFixed(2)}%" title="${esc(v.def.label)} · ${v.contrib.toFixed(1)} 分"></i>`).join('')}</div>
      <div class="rk-decomp-labels">${(() => {
        const red = parts.filter(v => v.level.key === 'danger'), rest = parts.filter(v => v.level.key !== 'danger');
        const sm = a => a.reduce((s, v) => s + v.contrib, 0).toFixed(1);
        return (red.length ? `<span><i class="rk-dot rk-f-danger"></i>危险 ${red.length} 项 ${sm(red)}</span>` : '')
          + `<span>其余 ${rest.length} 项 ${sm(rest)}</span><span class="rk-quiet">加权平均 ${R.mean.toFixed(1)}</span>`;
      })()}</div>
    </section>`;
}

function _riskHeadline(R) {

  const watch = R.used.filter(v => v.score >= 25);

function _expiryChartHTML(R) {
  const nav = R.c.nav;
  const csps = R.c.pos.filter(x => x.kind === 'short_put' && x.expiry);
  if (!nav || !csps.length) return '';
  const byWeek = {}; _expiryWeeks(csps).forEach(w => { byWeek[w.key] = w; });
  const keys = Object.keys(byWeek).sort();
  const start = new Date(_weekKey(_dayKey()) + 'T12:00:00'), last = new Date(keys[keys.length - 1] + 'T12:00:00');
  const weeks = [];
  for (let d = new Date(start); d <= last && weeks.length < 16; d.setDate(d.getDate() + 7)) {
    const k = d.toISOString().slice(0, 10), fri = new Date(d); fri.setDate(fri.getDate() + 4);
    weeks.push(byWeek[k] ? { ...byWeek[k], fri } : { key: k, total: 0, count: 0, items: [], fri });
  }
  const later = keys.filter(k => k > (weeks.length ? weeks[weeks.length - 1].key : '')).map(k => byWeek[k]);
  if (later.length) weeks.push({ key: 'later', total: later.reduce((s, w) => s + w.total, 0), count: later.reduce((s, w) => s + w.count, 0), items: later.flatMap(w => w.items), laterLabel: '之后' });
  const maxPct = Math.max(25, ...weeks.map(w => w.total / nav * 100)) * 1.1;
  return `
    <section class="rk-block">
      <h3 class="rk-block-title">CSP 到期</h3>
      <div class="rk-cols">
        ${weeks.map(w => {
          const pct = w.total / nav * 100, lv = riskLevel(_scoreMax(pct, [15, 25, 35]));
          const label = w.laterLabel || `${w.fri.getMonth() + 1}/${w.fri.getDate()}`;
          return `
            <div class="rk-col${w.count ? '' : ' empty'}" title="${esc(w.items.map(x => `${x.ticker} ${x.strike}P × ${x.qty} · ${x.expiry}`).join('\n') || '无')}">

                <em class="rk-col-guide" style="bottom:${(15 / maxPct * 100).toFixed(1)}%"></em></div>
              <span class="rk-col-label">${label}</span>
              <span class="rk-col-n">${w.count ? w.count + ' 笔' : ''}</span>
            </div>`;
        }).join('')}

      <div class="rk-note">虚线 15%.</div>
    </section>`;
}

function _greeksHTML(R) {
  const c = R.c;
  if (!c.isSchwab) return '';
  const opts = c.pos.filter(x => x.kind !== 'stock');
  const withD = opts.filter(x => x.delta != null && x.und != null);
  const noGreeks = opts.length > 0 && !withD.length;
  const KIND = { short_put: 'CSP', short_call: 'Short call', leaps: 'LEAPS', long_call: 'Long call', long_put: 'Long put' };
  const th = {}; Object.keys(KIND).forEach(k => { th[k] = { sum: 0, n: 0, miss: 0 }; });
  const byT = {};
  let usd = 0, pnl = 0, pnlN = 0, ivW = 0, ivN = 0;
  c.pos.forEach(x => {
    const qty = Number(x.qty) || 0, sgn = _isShortPos(x) ? -1 : 1;
    const t = byT[x.ticker] || (byT[x.ticker] = { t: x.ticker, sh: 0, usd: 0, theta: 0, n: 0, miss: 0 });
    t.n++;
    const dd = _dollarDelta(x);
    if (dd != null) { usd += dd; t.usd += dd; }
    if (x.kind === 'stock') t.sh += (x.side || 1) * qty;
    else if (x.delta != null) t.sh += x.delta * 100 * qty * sgn;
    else t.miss++;
    if (KIND[x.kind]) {
      if (x.theta != null) { const v = x.theta * 100 * qty * sgn; th[x.kind].sum += v; th[x.kind].n++; t.theta += v; }
      else th[x.kind].miss++;
    }
    const p = _posPnl(x); if (p != null) { pnl += p; pnlN++; }
    if (_isShortPos(x) && x.iv != null && x.exposure) { ivW += x.iv * x.exposure; ivN += x.exposure; }
  });
  const thetaNet = Object.values(th).reduce((s, o) => s + o.sum, 0);
  const sellers = th.short_put.sum + th.short_call.sum, buyers = th.leaps.sum + th.long_put.sum;
  const fig = (label, val, sub, cls = 'rk-t-acc') => `<div class="rk-fig"><span class="rk-fig-val ${cls}">${val}</span><span class="rk-fig-label">${label}</span>${sub ? `<span class="rk-fig-sub">${sub}</span>` : ''}</div>`;
  const signed = v => (v >= 0 ? '+' : '−') + '$' + Math.round(Math.abs(v)).toLocaleString();
  const rows = Object.values(byT).sort((a, b) => Math.abs(b.usd) - Math.abs(a.usd));
  return `
    <section class="rk-block">
      <h3 class="rk-block-title">Greeks</h3>
      ${noGreeks ? `<div class="rk-note">${esc(_needSchwab(c, ' Greeks'))}.</div>` : ''}
      <div class="rk-figs">
        ${noGreeks ? '' : fig('美元 Delta', signed(usd), c.nav ? `${(Math.abs(usd) / c.nav * 100).toFixed(0)}% NAV` : '')}
        ${noGreeks ? '' : fig('Theta/天', signed(thetaNet), `卖方 ${signed(sellers)} · 买方 ${signed(buyers)}`, thetaNet >= 0 ? 'rk-t-safe' : 'rk-t-alert')}
        ${pnlN ? fig('浮盈', signed(pnl), `${pnlN} 仓位`, pnl >= 0 ? 'rk-t-safe' : 'rk-t-danger') : ''}
        ${ivN ? fig('卖方 IV', (ivW / ivN).toFixed(1) + '%', '名义加权', 'rk-t-watch') : ''}
      </div>
      ${noGreeks ? '' : `
      ${_greeksVizHTML(R)}
      <div class="rk-sub-title">按策略</div>
      <div class="rk-table-wrap"><table class="rk-table rk-dd-table" id="rk-theta-table">
        <thead><tr><th>策略</th><th>Theta/天</th><th>仓位</th></tr></thead>
        ${Object.entries(KIND).filter(([k]) => th[k].n || th[k].miss).map(([k, label]) => {
          const ps = c.pos.filter(x => x.kind === k).map(x => ({ x, v: x.theta != null ? x.theta * 100 * (Number(x.qty) || 0) * (_isShortPos(x) ? -1 : 1) : null }))
            .sort((a, b) => (b.v ?? -1e12) - (a.v ?? -1e12));
          return `<tbody class="rk-dd" data-kind="${k}">
            <tr class="rk-dd-head" tabindex="0" role="button" onclick="this.parentElement.classList.toggle('open')" onkeydown="if(event.key==='Enter')this.click()">
              <td><span class="rk-caret">▸</span>${label}</td><td class="${th[k].sum >= 0 ? 'rk-t-safe' : 'rk-t-alert'}">${signed(th[k].sum)}</td>
              <td>${th[k].n}${th[k].miss ? ` <span class="rk-quiet">· 缺 Theta ${th[k].miss}</span>` : ''}</td></tr>
            ${ps.map(({ x, v }) => `<tr class="rk-dd-row gl-row" role="button" tabindex="0" onclick="openOptionLab(${c.pos.indexOf(x)})" onkeydown="if(event.key==='Enter')openOptionLab(${c.pos.indexOf(x)})"><td>${esc(_posLabel(x))}<div class="rk-dd-meta-m">${esc(_posMeta(x))}</div></td><td class="${v == null ? 'rk-quiet' : v >= 0 ? 'rk-t-safe' : 'rk-t-alert'}">${v == null ? '缺 Theta' : signed(v)}</td><td class="rk-dd-meta-d">${esc(_posMeta(x))}</td></tr>`).join('')}
          </tbody>`; }).join('')}
        <tbody><tr class="rk-total"><td>合计</td><td class="${_thCls(thetaNet)}">${signed(thetaNet)}</td><td></td></tr></tbody>
      </table></div>
      <div class="rk-sub-title">按标的</div>
      <div class="rk-table-wrap"><table class="rk-table rk-dd-table" id="rk-delta-table">
        <thead><tr><th>标的</th><th>Delta</th><th>美元 Delta</th><th>Theta/天</th></tr></thead>
        ${rows.map(t => {

          return `<tbody class="rk-dd" data-ticker="${esc(t.t)}">
            <tr class="rk-dd-head" tabindex="0" role="button" onclick="this.parentElement.classList.toggle('open')" onkeydown="if(event.key==='Enter')this.click()">
              <td><span class="rk-caret">▸</span>${esc(t.t)} <span class="rk-quiet">${t.n}${t.miss ? ` · 缺 Greeks ${t.miss}` : ''}</span></td>
              <td>${t.sh >= 0 ? '+' : ''}${Math.round(t.sh).toLocaleString()} Δ</td><td>${signed(t.usd)}</td><td class="${_thCls(t.theta)}">${t.theta ? signed(t.theta) : '—'}</td></tr>
            ${ps.map(x => {

              const sh = x.kind === 'stock' ? (x.side || 1) * qty : (x.delta != null ? x.delta * 100 * qty * sg : null);
              const dd = _dollarDelta(x), tv = x.theta != null ? x.theta * 100 * qty * sg : null;
              return `<tr class="rk-dd-row${x.kind === 'stock' ? '' : ' gl-row'}"${x.kind === 'stock' ? '' : ` role="button" tabindex="0" onclick="openOptionLab(${c.pos.indexOf(x)})"`}><td>${esc(_posLabel(x))}</td><td>${sh == null ? '<span class="rk-quiet">缺 Delta</span>' : (sh >= 0 ? '+' : '') + Math.round(sh).toLocaleString() + ' Δ'}</td><td>${dd == null ? '—' : signed(dd)}</td><td class="${_thCls(tv)}">${tv == null ? '—' : signed(tv)}</td></tr>`;
            }).join('')}
          </tbody>`; }).join('')}
      </table></div>
      <div class="rk-note">1 张 Δ 0.30 = 30 股. 卖方 Theta 为正.</div>`}
    </section>`;
}

/* ---------- post-trade: composite before → after ---------- */
function _simulatedPortfolio(t) {
  const p = getPortfolio();
  const pos = p.positions.slice();
  const und = (pos.find(x => x.ticker === t.ticker && x.und != null) || {}).und ?? null;
  if (t.kind === 'short_put') pos.push({ kind: 'short_put', ticker: t.ticker || '?', strike: t.strike, qty: t.qty, expiry: null, exposure: t.amount, und });
  if (t.kind === 'leaps') pos.push({ kind: 'leaps', ticker: t.ticker || '?', exposure: t.amount, cost: t.amount, marketValue: t.amount, expiry: null });
  const q = { ...p, positions: pos };
  if (t.kind === 'leaps') {
    if (q.cash != null) q.cash = q.cash - t.amount;
    else if (q.swvxx != null) q.swvxx = q.swvxx - t.amount;
  }
  return q;
}
function _simCompositeHTML(t) {
  const a = computeRisk().composite;
  const b = computeRisk(_simulatedPortfolio(t)).composite;
  if (a == null || b == null) return '';
  const la = riskLevel(a), lb = riskLevel(b);
  return `<div class="pr-sim-risk">综合风险 <b class="rk-t-${la.key}">${Math.round(a)} ${la.label}</b> → <b class="rk-t-${lb.key}">${Math.round(b)} ${lb.label}</b>`
    + `<span>${b - a >= 0.5 ? `+${(b - a).toFixed(0)}` : b - a <= -0.5 ? (b - a).toFixed(0) : '±0'} · 保证金类不模拟</span></div>`;
}

/* Global click → button ripple (A2) + haptic (MB4) */
document.addEventListener('click', (e) => {
  const target = e.target.closest('.btn, .picker-card, .segmented button, .item-check, .item-toggle button, .theme-btn, .item-btn, .edit-item-btn, .trend-range-btn');
  if (!target) return;
  // MB4 · Haptic feedback (Android; iOS no-op)
  if (typeof haptic === 'function') {
    if (target.classList.contains('primary') || target.classList.contains('item-btn') || target.classList.contains('edit-item-btn')) {
      haptic(10);  // Stronger feedback for primary actions
    } else {
      haptic(5);   // Subtle for secondary buttons
    }
  }
  // Ripple effect
  if (target.__rippleActive) return;
  const rect = target.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple-fx';
  const size = Math.max(rect.width, rect.height) / 30;
  ripple.style.left = (e.clientX - rect.left) + 'px';
  ripple.style.top = (e.clientY - rect.top) + 'px';
  ripple.style.width = size + 'px';
  ripple.style.height = size + 'px';
  target.appendChild(ripple);
  target.__rippleActive = true;
  setTimeout(() => { ripple.remove(); target.__rippleActive = false; }, 580);
});

/* Scroll → sticky header 'scrolled' state (F2) + verdict class */
function updateScrolledState() {
  const bar = document.querySelector('.status-bar');
  if (!bar) return;
  const scrolled = window.scrollY > 20;
  bar.classList.toggle('scrolled', scrolled);
}
window.addEventListener('scroll', updateScrolledState, { passive: true });

// Auto-sync on boot if Gist Sync is configured (Q2 = a: every launch)
(function bootAutoSync() {
  const cfg = loadSyncConfig();
  if (!cfg || !cfg.token) return;
  // Delay 800ms so UI renders + user sees the app before any sync toast
  setTimeout(() => { syncMergeSilent(); }, 800);
})();

// Schwab portfolio: fetch on launch, and on resume if older than a few minutes

  });
})();
