        ${overridesSearchQ ? `<button class="forced-search-clear" onclick="setOverridesSearchQuery('')" title="清空">×</button>` : ''}
      </div>
      ${tickerChipsHTML(allOverrides, overridesSearchQ, 'setOverridesSearchQuery')}
      ${filteredOverrides.length === 0 ? `
        <div style="font-size: 12px; color: var(--text-faint); padding: 12px 4px; font-style: italic;">

        </div>
      ` : `

          ${overrides.map(e => `

                <span class="override-time">${formatTimeAgo(e.timestampSort)}</span>
              </div>
              ${e.notes ? `<div class="override-notes">${esc(e.notes)}</div>` : '<div class="override-notes-empty">未填放弃原因</div>'}
            </div>
          `).join('')}
        </div>
        ${filteredOverrides.length > 5 ? `<div style="font-size: 11px; color: var(--text-faint); text-align: center; padding: 6px 0; font-style: italic;">还有 ${filteredOverrides.length - 5} 笔 · 用搜索或 ticker 标签定位</div>` : ''}
      `}
    </div>
  ` : '';

  // Losses learning
  const allLosses = history.filter(e => e.outcome === 'loss');
  const lossesSearchQ = (__lossesSearchQuery || '').trim().toUpperCase();
  const filteredLosses = lossesSearchQ
    ? allLosses.filter(e => (e.ticker || '').toUpperCase().includes(lossesSearchQ))
    : allLosses;
  const losses = filteredLosses.slice(0, 5);
  const lossesHTML = allLosses.length > 0 ? `
    <div class="picker-panel losses-learning">
      <div class="picker-panel-head">
        <span>亏损教训 · Losses Learning</span>
        <span class="picker-panel-count">${allLosses.length}</span>
      </div>
      <div style="font-size: 11px; color: var(--text-faint); margin-bottom: 8px; line-height: 1.4;">已结算的亏损记录 · 复盘避免重犯${allLosses.length > 5 ? ' · 显示最近 5 笔' : ''}</div>
      <div class="forced-search-row">
        <input type="text" class="forced-search-input" id="losses-search"
               placeholder="按 ticker 搜索 (如 MSFT)" value="${esc(lossesSearchQ)}"
               autocomplete="off" spellcheck="false" oninput="setLossesSearchQuery(this.value)">
        ${lossesSearchQ ? `<button class="forced-search-clear" onclick="setLossesSearchQuery('')" title="清空">×</button>` : ''}
      </div>
      ${tickerChipsHTML(allLosses, lossesSearchQ, 'setLossesSearchQuery')}
      ${filteredLosses.length === 0 ? `
        <div style="font-size: 12px; color: var(--text-faint); padding: 12px 4px; font-style: italic;">
          未找到匹配 "${esc(lossesSearchQ)}" 的亏损记录
        </div>
      ` : `
        <div class="picker-panel-list">
          ${losses.map(e => `
            <div class="loss-row">
              <div class="loss-header">
                <span class="loss-ticker">${esc(e.ticker || '—')}</span>
                <span class="loss-strategy">${esc(e.strategy)}</span>
                <span class="loss-time">${formatTimeAgo(e.timestampSort)}</span>
              </div>
              ${e.notes ? `<div class="loss-notes">${esc(e.notes)}</div>` : '<div class="loss-notes-empty">未填复盘</div>'}
            </div>
          `).join('')}
        </div>
        ${filteredLosses.length > 5 ? `<div style="font-size: 11px; color: var(--text-faint); text-align: center; padding: 6px 0; font-style: italic;">还有 ${filteredLosses.length - 5} 笔 · 用搜索或 ticker 标签定位</div>` : ''}
      `}
    </div>
  ` : '';

  // Available years from history (dynamic)
  const years = [...new Set(history.map(e => {
    // Parse year from timestamp string (e.g. "2026-07-06 09:15 ET") or timestampSort
    if (e.timestamp && e.timestamp.length >= 4) return e.timestamp.slice(0, 4);
    if (e.timestampSort) return new Date(e.timestampSort).getFullYear().toString();
    return null;
  }).filter(Boolean))].sort().reverse();

  // Explore panel — merged Open Positions here. Default filter shows current positions (outcome=open).
  const exploreHTML = `
    <div class="picker-panel explore-panel">
      <div class="picker-panel-head">
        <span>Explore · <span id="explore-mode-label">当前持仓 · Open Positions</span></span>
        <span class="picker-panel-count" id="explore-count-badge">${openPos.length}</span>
      </div>
      <div class="explore-filters">
        <input type="text" id="explore-ticker" placeholder="Ticker (e.g. MSFT)" autocomplete="off" spellcheck="false" list="tickers-datalist-explore" oninput="updateExploreResults()">
        ${renderTickerDatalist('tickers-datalist-explore')}
        <select id="explore-year" onchange="updateExploreResults()">
          <option value="">年份</option>
          ${years.map(y => `<option value="${y}">${y}</option>`).join('')}
        </select>
        <select id="explore-strategy" onchange="updateExploreResults()">
          <option value="">策略</option>
          <option value="LEAPS">LEAPS</option>
          <option value="PMCC">PMCC</option>
          <option value="CSP">CSP</option>
          <option value="CC">CC</option>
        </select>
        <select id="explore-outcome" onchange="updateExploreResults()">
          <option value="">状态 (全部)</option>
          <option value="open" selected>持仓 (默认)</option>
          <option value="skipped">未交易</option>
          <option value="opted_out">自主放弃</option>
          <option value="win">盈</option>
          <option value="loss">亏</option>
        </select>
        <button class="btn ghost small" onclick="clearExploreFilters()" title="清空所有筛选">×</button>
      </div>
      <div id="explore-results">${renderExploreDefaultResults()}</div>
    </div>
  `;

  // Stats: last 7 days
  const weekMs = 7 * 24 * 60 * 60 * 1000;
  const weekAgo = Date.now() - weekMs;
  const weekEntries = history.filter(e => e.timestampSort >= weekAgo);
  const weekTotal = weekEntries.length;
  const weekClear = weekEntries.filter(e => e.verdict.startsWith('CLEAR')).length;
  const weekBlocked = weekEntries.filter(e => e.verdict === 'BLOCKED').length;
  const clearRateWk = weekTotal > 0 ? Math.round(weekClear / weekTotal * 100) : 0;

  // Rolling 30-day win rate (settled only)
  const monthMs = 30 * 24 * 60 * 60 * 1000;
  const monthAgo = Date.now() - monthMs;
  const monthEntries = history.filter(e => e.timestampSort >= monthAgo);
  const monthWins = monthEntries.filter(e => e.outcome === 'win').length;
  const monthLosses = monthEntries.filter(e => e.outcome === 'loss').length;
  const monthSettled = monthWins + monthLosses;
  const winRate30d = monthSettled > 0 ? Math.round(monthWins / monthSettled * 100) : null;
  const winRateCls = winRate30d == null ? '' : winRate30d >= 60 ? 'pass' : winRate30d >= 40 ? 'pending' : 'fail';

  return `
    ${staleReminderHTML}
    ${exploreHTML}
    ${openHTML}
    ${overridesHTML}
    ${lossesHTML}
    ${strategyHTML}
    ${disciplineHTML}
    ${winRateTrendHTML()}
    ${checklistBacktestPanelHTML()}
    ${verdictSparklineHTML()}
    ${tickerWinRatePanelHTML()}
    ${forcedHTML}
    <div class="picker-stats">
      <div class="picker-stat" title="过去 7 天 snapshot 总数">
        <div class="picker-stat-num" data-anim-num="${weekTotal}" data-anim-key="wk-total" data-anim-format="int">${weekTotal}</div>
        <div class="picker-stat-label">本周 Snapshot</div>
      </div>
      <div class="picker-stat" title="过去 7 天 CLEAR verdict 数">
        <div class="picker-stat-num pass" data-anim-num="${weekClear}" data-anim-key="wk-clear" data-anim-format="int">${weekClear}</div>
        <div class="picker-stat-label">CLEAR</div>
      </div>
      <div class="picker-stat" title="过去 7 天 BLOCKED verdict 数">
        <div class="picker-stat-num fail" data-anim-num="${weekBlocked}" data-anim-key="wk-block" data-anim-format="int">${weekBlocked}</div>
        <div class="picker-stat-label">BLOCKED</div>
      </div>
      <div class="picker-stat" title="本周 CLEAR / 总数">
        <div class="picker-stat-num" data-anim-num="${clearRateWk}" data-anim-key="wk-clearrate" data-anim-format="percent">${clearRateWk}%</div>
        <div class="picker-stat-label">本周 CLEAR 率</div>
      </div>
      <div class="picker-stat" title="过去 30 天已结算 (盈+亏) 的胜率">
        <div class="picker-stat-num ${winRateCls}" ${winRate30d != null ? `data-anim-num="${winRate30d}" data-anim-key="wr-30d" data-anim-format="percent"` : ''}>${winRate30d != null ? winRate30d + '%' : '—'}</div>
        <div class="picker-stat-label">30 天胜率</div>
      </div>
    </div>
    ${mantraHTML()}
  `;
}

function renderExploreResultsFor(matches) {
  if (matches.length === 0) {
    return '<div class="explore-empty">无匹配</div>';
  }
  const totalMatches = matches.length;
  const traded = matches.filter(e => e.outcome === 'win' || e.outcome === 'loss' || e.outcome === 'open');
  const wins = matches.filter(e => e.outcome === 'win').length;
  const losses = matches.filter(e => e.outcome === 'loss').length;
  const winRate = (wins + losses) > 0 ? Math.round(wins / (wins + losses) * 100) : null;
  const summaryHTML = `
    <div class="explore-summary">
      <span>共 ${totalMatches}</span>
      ${traded.length > 0 ? `<span>· 已交易 ${traded.length}</span>` : ''}
      ${wins > 0 || losses > 0 ? `<span>· 盈 ${wins} · 亏 ${losses}${winRate != null ? ` · 胜率 ${winRate}%` : ''}</span>` : ''}
    </div>
  `;
  const rowsHTML = matches.slice(0, 500).map(e => {
    const cls = e.verdict.startsWith('CLEAR') ? 'pass' : e.verdict === 'BLOCKED' ? 'fail' : 'pending';
    const verdictShort = e.verdict.startsWith('CLEAR') ? 'CLEAR' : e.verdict === 'BLOCKED' ? 'BLOCK' : 'INSUFF';
    const outcomeLabel = e.outcome ? OUTCOME_LABEL[e.outcome] : null;
    // Extract STK + contracts for identification (works for CSP + LEAPS both)
    const idInfo = extractStrikeInfo(e);
    const stkTag = idInfo.strike ? `<span class="explore-row-stk">STK $${esc(idInfo.strike)}${idInfo.contracts ? ' × ' + esc(idInfo.contracts) : ''}</span>` : '';
    return `
      <div class="explore-row" data-preview-id="${e.id}">
        <span class="explore-row-time">${esc(e.timestamp.slice(0, 10))}</span>
        <span class="explore-row-ticker">${esc(e.ticker || '—')}</span>
        ${stkTag}
        <span class="explore-row-strategy" onclick="showEditModal('${e.id}')">${esc(e.strategy)}</span>
        <span class="explore-row-verdict ${cls}" onclick="showEditModal('${e.id}')">${verdictShort}</span>
        ${outcomeLabel ? `<span class="history-outcome ${e.outcome}" onclick="showEditModal('${e.id}')">${esc(outcomeLabel)}</span>` : ''}
        <button class="explore-row-del" onclick="deleteHistoryEntry('${e.id}'); event.stopPropagation();" title="删除此 snapshot">×</button>
      </div>
    `;
  }).join('');
  return summaryHTML + `<div class="explore-list">${rowsHTML}</div>`;
}

// Extract strike/contracts from either CSP or LEAPS state, used across explore + history rows
function extractStrikeInfo(e) {
  const fs = e.fullState || {};
  let strike = '';
  let contracts = '';
  // Priority order: cspStrike (CSP) → leapsStrike (LEAPS) → tradeStrike (generic) → inputs regex
  if (fs.cspStrike) strike = fs.cspStrike;
  else if (fs.leapsStrike) strike = fs.leapsStrike;
  else if (fs.tradeStrike) strike = fs.tradeStrike;
  else if (e.inputs) {
    const m = e.inputs.match(/strike=([\d.]+)/);
    if (m) strike = m[1];
  }
  if (fs.cspContracts) contracts = fs.cspContracts;
  else if (fs.leapsContracts) contracts = fs.leapsContracts;
  else if (fs.tradeContracts) contracts = fs.tradeContracts;
  else if (e.inputs) {
    const m = e.inputs.match(/contracts=(\d+)/);
    if (m) contracts = m[1];
  }
  return { strike, contracts };
}

function renderExploreDefaultResults() {
  // Default view: show only current positions (outcome=open)
  const openPositions = getActiveHistory().filter(e => e.outcome === 'open');
  return renderExploreResultsFor(openPositions);
}

function clearExploreFilters() {
  const tk = document.getElementById('explore-ticker');
  const yr = document.getElementById('explore-year');
  const st = document.getElementById('explore-strategy');
  const oc = document.getElementById('explore-outcome');
  if (tk) tk.value = '';
  if (yr) yr.value = '';
  if (st) st.value = '';
  if (oc) oc.value = 'open';  // Reset to default: open positions
  updateExploreResults();
}
window.clearExploreFilters = clearExploreFilters;

function updateExploreResults() {
  const ticker = (document.getElementById('explore-ticker')?.value || '').trim().toUpperCase();
  const year = document.getElementById('explore-year')?.value || '';
  const strategy = document.getElementById('explore-strategy')?.value || '';
  const outcome = document.getElementById('explore-outcome')?.value || '';
  const container = document.getElementById('explore-results');
  if (!container) return;

  let matches = getActiveHistory();
  if (ticker) matches = matches.filter(e => e.ticker && e.ticker.toUpperCase().includes(ticker));
  if (year) matches = matches.filter(e => {
    if (e.timestamp && e.timestamp.length >= 4) return e.timestamp.slice(0, 4) === year;
    if (e.timestampSort) return new Date(e.timestampSort).getFullYear().toString() === year;
    return false;
  });
  if (strategy) matches = matches.filter(e => e.strategy && e.strategy.startsWith(strategy));
  if (outcome) matches = matches.filter(e => e.outcome === outcome);

  // Update mode label + count based on active filters
  const labelEl = document.getElementById('explore-mode-label');
  const countEl = document.getElementById('explore-count-badge');
  if (labelEl) {
    const anyFilter = ticker || year || strategy || (outcome && outcome !== 'open');
    if (!anyFilter && outcome === 'open') {
      labelEl.textContent = '当前持仓 · Open Positions';
    } else if (anyFilter) {
      const parts = [];
      if (outcome) parts.push({skipped:'未交易', opted_out:'自主放弃', open:'持仓', win:'盈', loss:'亏'}[outcome] || outcome);
      if (strategy) parts.push(strategy);
      if (ticker) parts.push(ticker);
      if (year) parts.push(year);
      labelEl.textContent = parts.length ? '筛选: ' + parts.join(' · ') : '搜索历史';
    } else {
      labelEl.textContent = '搜索历史';
    }
  }
  if (countEl) countEl.textContent = matches.length;

  container.innerHTML = renderExploreResultsFor(matches);
}
window.updateExploreResults = updateExploreResults;

// User-selected trend range (persisted)
const TREND_RANGE_KEY = 'pretrade_trend_range';
let trendRange = '3M';  // default
function loadTrendRange() {
  try {
    const saved = localStorage.getItem(TREND_RANGE_KEY);
    if (['1M', '3M', 'YTD', '1Y', '3Y'].includes(saved)) trendRange = saved;
  } catch (e) {}
}
function setTrendRange(r) {
  trendRange = r;
  try { localStorage.setItem(TREND_RANGE_KEY, r); } catch (e) {}
  // Only re-render the trend panel, not the whole page
  const panel = document.querySelector('.trend-panel');
  if (panel) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = winRateTrendHTML();
    const newPanel = wrapper.firstElementChild;
    if (newPanel) panel.replaceWith(newPanel);
  } else {
    render();
  }
}
window.setTrendRange = setTrendRange;

function _rangeParams(range) {
  const D = 86400000;
  const now = Date.now();
  switch (range) {
    case '1M':  return { spanMs: 30 * D,   bucketMs: 3 * D,   xFmt: 'md',  rangeText: '过去 1 个月' };
    case '3M':  return { spanMs: 91 * D,   bucketMs: 7 * D,   xFmt: 'md',  rangeText: '过去 3 个月' };
    case 'YTD': {
      const yearStart = new Date(new Date().getFullYear(), 0, 1).getTime();
      return { spanMs: now - yearStart, bucketMs: 30 * D, xFmt: 'm',  rangeText: '年初至今' };
    }
    case '1Y':  return { spanMs: 365 * D,  bucketMs: 30 * D,  xFmt: 'm',   rangeText: '过去 1 年' };
    case '3Y':  return { spanMs: 1095 * D, bucketMs: 91 * D,  xFmt: 'q',   rangeText: '过去 3 年' };
    default:    return { spanMs: 91 * D,   bucketMs: 7 * D,   xFmt: 'md',  rangeText: '过去 3 个月' };
  }
}

function winRateTrendHTML() {
  const history = getActiveHistory();
  if (history.length < 3) return '';

  const range = trendRange;
  const { spanMs, bucketMs, xFmt, rangeText } = _rangeParams(range);
  const now = Date.now();
  const numBuckets = Math.max(2, Math.round(spanMs / bucketMs));

  // Build buckets: buckets[0] = oldest, buckets[N-1] = current
  const buckets = [];
  for (let i = numBuckets - 1; i >= 0; i--) {
    const end = now - i * bucketMs;
    const start = end - bucketMs;
    buckets.push({ start, end, snapshots: [] });
  }

  history.forEach(e => {
    const ts = e.timestampSort || Date.parse(e.timestamp);
    if (!ts) return;
    for (const b of buckets) {
      if (ts >= b.start && ts < b.end) {
        b.snapshots.push(e);
        break;
      }
    }
  });

  // Per-bucket stats
  const points = buckets.map(b => {
    const total = b.snapshots.length;
    const clear = b.snapshots.filter(e => (e.verdict || '').startsWith('CLEAR')).length;
    const blocked = b.snapshots.filter(e => e.verdict === 'BLOCKED').length;
    const pending = b.snapshots.filter(e => e.verdict === 'PENDING').length;
    const forced = b.snapshots.filter(e => e.forcedReason).length;
    return { total, clear, blocked, pending, forced };
  });

  const rangePicker = `
    <div class="trend-range-picker">
      ${['1M','3M','YTD','1Y','3Y'].map(r => `
        <button class="trend-range-btn ${r === range ? 'active' : ''}" onclick="setTrendRange('${r}')">${r}</button>
      `).join('')}
    </div>
  `;

  const totalCounts = points.map(p => p.total);
  const maxCount = Math.max(...totalCounts);
  const totalSum = totalCounts.reduce((a, b) => a + b, 0);
  const nonEmpty = totalCounts.filter(c => c > 0);
  const avgCount = nonEmpty.length > 0 ? (totalSum / nonEmpty.length).toFixed(1) : '0';

  if (maxCount === 0) {
    return `
      <div class="picker-panel trend-panel">
        <div class="picker-panel-header trend-header">
          <div>
            <div class="picker-panel-title">月度活动量 · Monthly Activity</div>
            <div class="picker-panel-sub">${rangeText}区间无数据</div>
          </div>
          ${rangePicker}
        </div>
      </div>
    `;
  }

  const spansYears = new Set(buckets.map(b => new Date(b.end).getFullYear())).size > 1;

  const W = 640, H = 200, padL = 40, padR = 16, padT = 20, padB = 34;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const barGap = 6;
  const barW = Math.max(6, (chartW / points.length) - barGap);

  // Y-axis: dynamic based on maxCount, aim for ~4 grid lines
  const yTickStep = maxCount <= 4 ? 1 : maxCount <= 8 ? 2 : maxCount <= 16 ? 4 : Math.ceil(maxCount / 4);
  const yMax = Math.ceil(maxCount / yTickStep) * yTickStep;
  const yLabels = [];
  for (let v = 0; v <= yMax; v += yTickStep) yLabels.push(v);
  const yGridLines = yLabels.map(v => {
    const y = padT + chartH - (v / yMax) * chartH;
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="2 3"/>
            <text x="${padL - 6}" y="${y + 4}" font-size="12" fill="var(--text-faint)" text-anchor="end" font-family="var(--mono)">${v}</text>`;
  }).join('');

  const fmtLabel = (date) => {
    const M = date.getMonth() + 1, D = date.getDate(), Y = date.getFullYear();
    if (xFmt === 'md') return spansYears ? `${Y % 100}/${M}/${D}` : `${M}/${D}`;
    if (xFmt === 'm')  return spansYears ? `${Y % 100}/${M}月` : `${M}月`;
    if (xFmt === 'q')  { const Q = Math.floor((M - 1) / 3) + 1; return `${Y % 100}Q${Q}`; }
    return `${M}/${D}`;
  };

  // Bars: 4-segment stacked (CLEAR / PENDING / BLOCKED-respected / FORCED)
  // Semantic colors carry the story — no need for over-active red border
  const avgNum = parseFloat(avgCount) || 1;
  const bars = points.map((p, i) => {
    const x = padL + i * (barW + barGap) + barGap / 2;
    if (p.total === 0) return '';
    // Segment counts (bottom to top: quality decreasing)
    const nClear = p.clear;
    const nPending = p.pending;
    const blockedRespected = Math.max(0, p.blocked - p.forced);  // BLOCKED but not forced
    const nForced = p.forced;
    const totalH = (p.total / yMax) * chartH;
    const yTop = padT + chartH - totalH;
    // Stack from bottom (CLEAR) to top (FORCED)
    const segments = [
      { count: nClear,          fill: 'var(--pass)',                                          label: 'CLEAR' },
      { count: nPending,        fill: 'var(--pending)',                                       label: '条件不足' },
      { count: blockedRespected,fill: 'color-mix(in srgb, var(--fail) 40%, var(--panel-2))',  label: 'BLOCKED (未硬冲)' },
      { count: nForced,         fill: 'var(--fail)',                                          label: 'FORCED · 硬冲' },
    ];
    let cursorY = padT + chartH;
    const segSVG = segments.map(seg => {
      if (seg.count === 0) return '';
      const segH = (seg.count / yMax) * chartH;
      const segY = cursorY - segH;
      cursorY = segY;
      return `<rect x="${x.toFixed(1)}" y="${segY.toFixed(1)}" width="${barW.toFixed(1)}" height="${segH.toFixed(1)}" fill="${seg.fill}" stroke="var(--panel)" stroke-width="0.5"/>`;
    }).join('');
    // Tooltip: complete breakdown
    const dateLabel = fmtLabel(new Date(buckets[i].end));
    const parts = [`共 ${p.total} 笔`];
    if (nClear > 0) parts.push(`CLEAR ${nClear}`);
    if (nPending > 0) parts.push(`条件不足 ${nPending}`);
    if (blockedRespected > 0) parts.push(`BLOCKED ${blockedRespected}`);
    if (nForced > 0) parts.push(`硬冲 ${nForced}`);
    const overActive = p.total > avgNum * 1.5 && p.total >= 5;
    const tip = `${dateLabel} · ${parts.join(' · ')}${overActive ? ' · 过度活跃' : ''}`;
    // Count label above bar (bumped for mobile legibility)
    const countLabel = p.total >= 1
      ? `<text x="${(x + barW / 2).toFixed(1)}" y="${(yTop - 5).toFixed(1)}" font-size="13" fill="var(--text-dim)" text-anchor="middle" font-family="var(--mono)" font-weight="600">${p.total}</text>`
      : '';
    // Escape for onclick attribute
    const safeTip = tip.replace(/"/g, '&quot;').replace(/'/g, "\\'");
    return `
      <g class="activity-bar" onclick="showActivityDetail('${safeTip}')" style="cursor: pointer;">
        ${segSVG}
        <rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${totalH.toFixed(1)}"
              fill="transparent" stroke="transparent" pointer-events="all">
          <title>${tip}</title>
        </rect>
        ${countLabel}
      </g>
    `;
  }).join('');

  // X-axis labels: show at most 6, evenly spaced
  const numXLabels = points.length <= 6 ? points.length : 6;
  const xLabelIdxs = [];
  for (let i = 0; i < numXLabels; i++) xLabelIdxs.push(Math.round(i * (points.length - 1) / (numXLabels - 1)));
  const xTicks = xLabelIdxs.map(idx => {
    const x = padL + idx * (barW + barGap) + barGap / 2 + barW / 2;
    return `<text x="${x.toFixed(1)}" y="${H - 12}" font-size="12" fill="var(--text-faint)" text-anchor="middle" font-family="var(--mono)">${fmtLabel(new Date(buckets[idx].end))}</text>`;
  }).join('');

  // Average line
  const avgY = padT + chartH - (avgNum / yMax) * chartH;
  const avgLine = avgNum > 0 ? `
    <line x1="${padL}" y1="${avgY.toFixed(1)}" x2="${W - padR}" y2="${avgY.toFixed(1)}"
          stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
    <text x="${W - padR - 4}" y="${(avgY - 5).toFixed(1)}" font-size="11" fill="var(--text-faint)"
          text-anchor="end" font-family="var(--mono)" font-style="italic">均值 ${avgCount}</text>
  ` : '';

  // Peak identification
  const peakIdx = points.findIndex(p => p.total === maxCount);
  const peakLabel = peakIdx >= 0 ? fmtLabel(new Date(buckets[peakIdx].end)) : '';

  // Aggregate quality distribution across the whole range
  const totalClear = points.reduce((s, p) => s + p.clear, 0);
  const totalPending = points.reduce((s, p) => s + p.pending, 0);
  const totalBlocked = points.reduce((s, p) => s + p.blocked, 0);
  const totalForced = points.reduce((s, p) => s + p.forced, 0);
  const blockedRespectedSum = Math.max(0, totalBlocked - totalForced);
  const clearPct = totalSum > 0 ? Math.round(totalClear / totalSum * 100) : 0;

  return `
    <div class="picker-panel trend-panel">
      <div class="picker-panel-header trend-header">
        <div>
          <div class="picker-panel-title">月度活动量 · Monthly Activity <span class="trend-range-label">· ${rangeText}</span></div>
          <div class="picker-panel-sub">
            <span class="activity-summary">共 ${totalSum} 笔 · 峰值 ${maxCount} (${esc(peakLabel)}) · 均值 ${avgCount}/期 · CLEAR 率 ${clearPct}%</span>
            <span class="trend-note" title="堆叠柱按品质从底到顶: CLEAR (绿) → 条件不足 (琥珀) → BLOCKED 未硬冲 (淡红) → FORCED 硬冲 (深红). 悬停看具体分布.">ⓘ</span>
          </div>
          <div class="activity-legend">
            <span class="al-item"><span class="al-swatch" style="background: var(--pass);"></span>CLEAR ${totalClear}</span>
            ${totalPending > 0 ? `<span class="al-item"><span class="al-swatch" style="background: var(--pending);"></span>条件不足 ${totalPending}</span>` : ''}
            ${blockedRespectedSum > 0 ? `<span class="al-item"><span class="al-swatch" style="background: color-mix(in srgb, var(--fail) 40%, var(--panel-2));"></span>BLOCKED ${blockedRespectedSum}</span>` : ''}
            ${totalForced > 0 ? `<span class="al-item"><span class="al-swatch" style="background: var(--fail);"></span>硬冲 ${totalForced}</span>` : ''}
          </div>
        </div>
        ${rangePicker}
      </div>
      <div class="trend-chart-wrap">
        <svg class="trend-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
          ${yGridLines}
          ${bars}
          ${avgLine}
          ${xTicks}
        </svg>
        <div class="activity-detail" id="activity-detail">
          <span class="activity-detail-hint">点击柱子查看详情 · 或悬停</span>
        </div>
      </div>
    </div>
  `;
}

function checklistBacktestPanelHTML() {
  const history = getActiveHistory();
  const settled = history.filter(e => (e.outcome === 'win' || e.outcome === 'loss'));
  if (settled.length < 2) {
    // Show placeholder so user knows this panel exists
    return `
      <div class="picker-panel backtest-panel backtest-empty">
        <div class="picker-panel-head">
          <span>Checklist 回测 · Backtest</span>
          <span class="picker-panel-count">${settled.length}/2</span>
        </div>
        <div class="backtest-empty-msg">
          需 ≥ 2 笔已结算 (win/loss) 的 snapshot 才有意义.<br>
          现有 ${settled.length} 笔 · 待更多数据后此处将对比 <b>CLEAR 胜率</b> vs <b>硬冲胜率</b>.
        </div>
      </div>
    `;
  }

  // Actual: all settled trades
  const actualWins = settled.filter(e => e.outcome === 'win').length;
  const actualLosses = settled.filter(e => e.outcome === 'loss').length;
  const actualTotal = actualWins + actualLosses;
  const actualRate = Math.round(actualWins / actualTotal * 100);

  // Strict: only CLEAR (including 软执行) settled trades
  const strict = settled.filter(e => (e.verdict || '').startsWith('CLEAR'));
  const strictWins = strict.filter(e => e.outcome === 'win').length;
  const strictLosses = strict.filter(e => e.outcome === 'loss').length;
  const strictTotal = strictWins + strictLosses;
  const strictRate = strictTotal > 0 ? Math.round(strictWins / strictTotal * 100) : null;

  // 硬冲: PENDING or BLOCKED that were still traded (had outcome)
  const forced = settled.filter(e => {
    const v = e.verdict || '';
    return v === 'PENDING' || v === 'BLOCKED';
  });
  const forcedWins = forced.filter(e => e.outcome === 'win').length;
  const forcedLosses = forced.filter(e => e.outcome === 'loss').length;
  const forcedTotal = forcedWins + forcedLosses;
  const forcedRate = forcedTotal > 0 ? Math.round(forcedWins / forcedTotal * 100) : null;

  // Delta calc
  let deltaLabel = '', deltaCls = '';
  if (strictRate != null) {
    const d = strictRate - actualRate;
    if (d > 0) { deltaLabel = `+${d}%`; deltaCls = 'pass'; }
    else if (d < 0) { deltaLabel = `${d}%`; deltaCls = 'fail'; }
    else deltaLabel = '±0%';
  }

  // Conclusion
  let conclusion = '';
  if (strictRate != null && actualTotal > 0) {
    if (strictRate > actualRate + 5) {
      conclusion = `<b>严格 CLEAR 策略较当前做法胜率高 ${strictRate - actualRate} 个百分点</b> · 硬冲拖累整体表现, 建议未来跳过"条件不足"/ BLOCKED.`;
    } else if (strictRate < actualRate - 5) {
      conclusion = `硬冲反而给你带来了额外的赢面? 可能是你 checklist 太严, 或者硬冲样本极小 (${forcedTotal} 笔). 谨慎解读.`;
    } else {
      conclusion = `严格 CLEAR 与实际做法胜率接近 · checklist 大致合理, 硬冲影响不大 (但样本 ${forcedTotal} 笔).`;
    }
  }

  return `
    <div class="picker-panel">
      <div class="picker-panel-header">
        <div class="picker-panel-title">Checklist 回测 · 假设严格执行</div>
        <div class="picker-panel-sub">若仅执行 CLEAR, 历史胜率将为多少?</div>
      </div>
      <div class="backtest-grid">
        <div class="backtest-cell">
          <div class="backtest-label">实际胜率 (所有交易)</div>
          <div class="backtest-value" data-anim-num="${actualRate}" data-anim-key="bt-actual" data-anim-format="percent">${actualRate}%</div>
          <div class="backtest-detail">${actualWins} 胜 · ${actualLosses} 负 · ${actualTotal} 笔</div>
        </div>
        <div class="backtest-cell strict">
          <div class="backtest-label">严格 CLEAR 胜率</div>
          <div class="backtest-value" ${strictRate != null ? `data-anim-num="${strictRate}" data-anim-key="bt-strict" data-anim-format="percent"` : ''}>${strictRate != null ? strictRate + '%' : '—'}</div>
          <div class="backtest-detail">${strictWins} 胜 · ${strictLosses} 负 · ${strictTotal} 笔</div>
        </div>
        <div class="backtest-cell delta">
          <div class="backtest-label">差异</div>
          <div class="backtest-value ${deltaCls}">${deltaLabel}</div>
          <div class="backtest-detail">${strictRate != null && strictRate > actualRate ? '严格 > 实际' : strictRate != null && strictRate < actualRate ? '严格 < 实际' : '持平'}</div>
        </div>
        <div class="backtest-cell forced">
          <div class="backtest-label">硬冲表现 (条件不足/BLOCKED)</div>
          <div class="backtest-value ${forcedRate != null && forcedRate < 40 ? 'fail' : ''}" ${forcedRate != null ? `data-anim-num="${forcedRate}" data-anim-key="bt-forced" data-anim-format="percent"` : ''}>${forcedRate != null ? forcedRate + '%' : '—'}</div>
          <div class="backtest-detail">${forcedWins} 胜 · ${forcedLosses} 负 · ${forcedTotal} 笔</div>
        </div>
      </div>
      ${conclusion ? `<div class="backtest-conclusion">${conclusion}</div>` : ''}
    </div>
  `;
}

function tickerWinRatePanelHTML() {
  const history = getActiveHistory();
  const settled = history.filter(e => e.outcome === 'win' || e.outcome === 'loss');
  if (settled.length < 2) {
    return `
      <div class="picker-panel ticker-wr-empty">
        <div class="picker-panel-head">
          <span>Ticker 胜率 · Winner / Loser Tickers</span>
          <span class="picker-panel-count">${settled.length}/2</span>
        </div>
        <div class="backtest-empty-msg">
          需 ≥ 2 笔已结算的 snapshot 才有意义.<br>
          结算 (win/loss) 更多后, 此处将显示 <b>你在哪些 ticker 上赚钱 / 亏钱</b>.
        </div>
      </div>
    `;
  }

  // Filter by strategy
  const filterMode = __tickerWrFilter;
  const filtered = filterMode === 'all'
    ? settled
    : settled.filter(e => (e.strategy || '').toUpperCase().startsWith(filterMode));

  // Group by ticker
  const byTicker = {};
  filtered.forEach(e => {
    const t = (e.ticker || '').toUpperCase();
    if (!t) return;
    if (!byTicker[t]) byTicker[t] = { wins: 0, losses: 0, total: 0 };
    byTicker[t].total++;
    if (e.outcome === 'win') byTicker[t].wins++;
    else if (e.outcome === 'loss') byTicker[t].losses++;
  });
  // Only tickers with ≥ 2 settled trades
  const rows = Object.entries(byTicker)
    .filter(([, v]) => v.total >= 2)
    .map(([ticker, v]) => ({
      ticker,
      total: v.total,
      wins: v.wins,
      losses: v.losses,
      wr: Math.round(v.wins / v.total * 100)
    }))
    .sort((a, b) => b.wr - a.wr || b.total - a.total)
    .slice(0, 10);  // Top 10

  const filterLabel = { all: '汇总', LEAPS: 'LEAPS', CSP: 'CSP', PMCC: 'PMCC', CC: 'CC' }[filterMode];

  const filterTabsHTML = `
    <div class="twr-filter-row">
      <span class="twr-filter-label">策略:</span>
      <div class="twr-filter-tabs">
        ${['all', 'LEAPS', 'CSP', 'PMCC', 'CC'].map(k => `
          <button class="twr-filter-tab ${filterMode === k ? 'active' : ''}" onclick="setTickerWrFilter('${k}')">${k === 'all' ? '汇总' : k}</button>
        `).join('')}
      </div>
    </div>
  `;

  // If no rows for this filter, still show panel with filter + empty state
  if (rows.length === 0) {
    return `
      <div class="picker-panel">
        <div class="picker-panel-head">
          <span>Ticker 胜率排行 · ${esc(filterLabel)}</span>
          <span class="picker-panel-count">0</span>
        </div>
        ${filterTabsHTML}
        <div class="backtest-empty-msg" style="padding: 12px 4px;">
          ${filterMode === 'all' ? '暂无 ≥ 2 次已结算的 ticker.' : `暂无 ${filterLabel} 策略下 ≥ 2 次已结算的 ticker.`}
        </div>
      </div>
    `;
  }

  return `
    <div class="picker-panel">
      <div class="picker-panel-head">
        <span>Ticker 胜率排行 · ${esc(filterLabel)}</span>
        <span class="picker-panel-count">${rows.length}</span>
      </div>
      ${filterTabsHTML}
      <div class="picker-panel-sub" style="margin-bottom: 8px;">≥ 2 次已结算的 ticker · 识别历史优势标的与短板</div>
      <div class="ticker-winrate-list">
        ${rows.map(r => {
          const wrCls = r.wr >= 60 ? 'pass' : r.wr >= 40 ? 'pending' : 'fail';
          const barPct = Math.min(100, r.wr);
          return `
            <div class="ticker-winrate-row">
              <div class="twr-ticker">${esc(r.ticker)}</div>
              <div class="twr-bar">
                <div class="twr-bar-fill ${wrCls}" style="width: ${barPct}%"></div>
                <div class="twr-bar-label ${wrCls}">${r.wr}% · ${r.total} 笔 · ${r.wins}胜 / ${r.losses}负</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function daysSinceLastSnapshotHTML() {
  const history = getActiveHistory();
  if (history.length === 0) return '';
  const latest = history[0];  // history is sorted newest first
  const ts = latest.timestampSort || Date.parse(latest.timestamp);
  if (!ts) return '';
  const days = Math.floor((Date.now() - ts) / 86400000);
  if (days === 0) return `<div class="last-snap-bar today">今日已 snapshot · ${esc(latest.ticker || '')} ${esc(latest.strategy || '')}</div>`;
  if (days === 1) return `<div class="last-snap-bar">距上次 snapshot: <b>1 天前</b> · ${esc(latest.ticker || '—')} ${esc(latest.strategy || '')}</div>`;
  const cls = days > 14 ? 'stale' : days > 7 ? 'aging' : '';
  return `<div class="last-snap-bar ${cls}">距上次 snapshot: <b>${days} 天前</b>${days > 14 ? ' · 长时间未自查, 记得每笔单前用 checklist' : ''} · 最新: ${esc(latest.ticker || '—')} ${esc(latest.strategy || '')}</div>`;
}

  const usageCls = usage.ratio > 0.8 ? 'fail' : usage.ratio > 0.5 ? 'pending' : 'pass';

  // State 2 & 3: Configured

function getAllTickers() {
  const history = getActiveHistory();

}

// Get all open exposures for a ticker across strategies
function getTickerExposureBreakdown(ticker) {
  if (!ticker) return { total: 0, byStrat: {} };
  const history = getActiveHistory();
  const t = ticker.toUpperCase();
  const byStrat = { LEAPS: { count: 0, val: 0, items: [] }, CSP: { count: 0, val: 0, items: [] }, PMCC: { count: 0, val: 0, items: [] }, CC: { count: 0, val: 0, items: [] } };
  history.forEach(e => {
    if (e.outcome !== 'open') return;
    if ((e.ticker || '').toUpperCase() !== t) return;
    const strat = (e.strategy || '').split(' ')[0].toUpperCase();
    if (!byStrat[strat]) byStrat[strat] = { count: 0, val: 0, items: [] };
    let val = 0;
    if (strat === 'CSP') {
      const inp = e.inputs || '';
      const strikeMatch = inp.match(/strike=(\d+\.?\d*)/);
      const contractsMatch = inp.match(/contracts=(\d+)/) || inp.match(/cn=(\d+)/);
      if (strikeMatch) {
        const strike = parseFloat(strikeMatch[1]);
        const contracts = contractsMatch ? parseFloat(contractsMatch[1]) : 1;
        val = strike * 100 * contracts;
      } else if (e.fullState && e.fullState.cspThisNominal) {
        val = parseFloat(e.fullState.cspThisNominal) || 0;
      }
    } else {
      // LEAPS / PMCC / CC — use budget as proxy
      if (e.fullState && e.fullState.budget) val = parseFloat(e.fullState.budget) || 0;
    }
    if (val > 0) {
      byStrat[strat].count += 1;
      byStrat[strat].val += val;
      byStrat[strat].items.push({ id: e.id, subtype: e.subtype, val });
    }
  });
  const total = Object.values(byStrat).reduce((s, o) => s + o.val, 0);
  return { total, byStrat };
}

function tickerExposurePanelHTML(ticker) {
  const { total, byStrat } = getTickerExposureBreakdown(ticker);
  if (total === 0) return '';  // No existing exposure — hide panel entirely
  const nav = parseFloat(state.nav || loadSavedNav()) || 0;
  const totalPct = nav > 0 ? (total / nav * 100).toFixed(1) : null;
  const rows = ['LEAPS', 'CSP', 'PMCC', 'CC']
    .filter(k => byStrat[k] && byStrat[k].count > 0)
    .map(k => {
      const g = byStrat[k];
      const pct = nav > 0 ? (g.val / nav * 100).toFixed(1) : null;
      return `<span class="tep-row"><b>${k}</b> ${g.count}张 · $${Math.round(g.val).toLocaleString()}${pct != null ? ` · ${pct}%` : ''}</span>`;
    }).join('');
  const totalCls = totalPct != null && parseFloat(totalPct) > 30 ? 'high' : parseFloat(totalPct) > 15 ? 'mid' : '';
  return `
    <div class="ticker-exposure-panel ${totalCls}">
      <div class="tep-head">${esc(ticker.toUpperCase())} · 跨策略敞口汇总</div>
      <div class="tep-body">${rows}</div>
      ${totalPct != null ? `<div class="tep-total">合计: <b>${totalPct}%</b> NAV · $${Math.round(total).toLocaleString()}</div>` : ''}
    </div>
  `;
}

          <div class="num-field"><label class="num-field-label">本笔 Strike ($) · STK</label>
            <input inputmode="decimal" type="number" id="in-csp-strike" placeholder="e.g. 50" value="${esc(state.cspStrike)}"></div>
          <div class="num-field"><label class="num-field-label">张数</label>
            <input inputmode="numeric" type="number" id="in-csp-contracts" placeholder="1" value="${esc(state.cspContracts)}" min="1"></div>
          <div class="num-field"><label class="num-field-label">到期日</label>
            <input type="date" id="in-csp-expiry" value="${esc(state.tradeExpiry || '')}"></div>
          <div class="num-field"><label class="num-field-label">本笔 nominal (自动)</label>
            <div class="computed-value">${computedNominal > 0 ? '$' + Math.round(computedNominal).toLocaleString() : '<span style="color:var(--text-faint);">先填 STK + 张数</span>'}</div></div>
          <div class="num-field"><label class="num-field-label">本 ticker 现有 CSP
            <button class="autofill-btn" onclick="autoFillCspTicker()" title="从 history 里 outcome=持仓 且相同 ticker 的 CSP 快照自动汇总">Auto</button>
          </label>
            <input inputmode="decimal" type="number" id="in-csp-ticker-ex" placeholder="0" value="${esc(state.cspTickerExisting)}"${_autoAttr('cspTickerExisting')}></div>
          <div class="num-field"><label class="num-field-label">波动性类型</label>
            <div class="segmented" id="csp-vol-seg" style="margin-top: 0;">
              <button data-v="medium">中波动 (≤12%)</button>
              <button data-v="high">高波动 (≤10%)</button>
            </div></div>
        </div>
        ${(() => { const cs = _cspSummaryState(); return `
        <div class="position-summary ${cs.totalCls}" id="csp-total-summary">
          <span class="position-summary-label">CSP 总敞口 / NAV</span>
          <span class="position-summary-val ${cs.totalCls}">${cs.totalHTML}</span>
        </div>
        <div class="position-summary ${cs.tickerCls}" id="csp-ticker-summary" style="margin-top: 8px;">
          <span class="position-summary-label">单 ticker 敞口 / NAV</span>
          <span class="position-summary-val ${cs.tickerCls}">${cs.tickerHTML}</span>
        </div>`; })()}
        ${_quoteBlocksHTML()}
        ${state.strategy === 'csp' ? cspMaxHTML() : leapsMaxHTML()}
        ${portfolioSimHTML()}
        ${_previewBlockHTML()}
      </div>
    `;
  }
  if (state.strategy === 'pmcc' || state.strategy === 'cc') configHTML = _callTradeConfigHTML();

  let checklistHTML = '';
  const groupKey = (name) => {
    if (name.includes('Discipline')) return 'discipline';
    if (name.includes('Market')) return 'market';
    if (name.includes('Underlying')) return 'underlying';
    if (name.includes('Position') || name.includes('sizing')) return 'position';
    if (name.includes('Trade plan')) return 'plan';
    if (name.includes('Contract')) return 'contract';
    if (name.includes('Entry signals')) return 'entry';
    if (name.includes('LEAPS health')) return 'health';
    if (name.includes('Short call')) return 'shortcall';
    if (name.includes('Close') || name.includes('gradient')) return 'close';
    return 'other';
  };
  groups.forEach(g => {
    let count = 0;
    g.items.forEach(it => { if (itemVerdict(it) === 'pass') count++; });
    checklistHTML += `
      <div class="group" data-group-key="${groupKey(g.name)}">
        <div class="group-header">
          <div class="group-title">${esc(g.name)}</div>
          <div class="group-count">${count} / ${g.items.length}</div>
        </div>
        <div class="items">${g.items.map(it => itemHTML(it)).join('')}</div>
      </div>
    `;
  });

  const v = overallVerdict();
  const isClose = state.strategy === 'leaps' && state.leapsDirection === 'close';
  const blockMsg = isClose
    ? '任一 block = 不关仓, 重新评估。'
    : '任一 block = 不开仓。';

  $app.innerHTML = `
    ${headerHTML()}
    ${tickerBarHTML()}
    ${statusBarHTML()}
    ${progressBarHTML()}
    ${qrefHTML()}
    ${configHTML}
    <div class="tc" id="tech-strip">${techStripInnerHTML()}</div>
    ${checklistHTML}
    ${bottomSummaryHTML()}
    <div class="disclaimer">
      Self-check only. Not investment advice.<br>
      ${blockMsg}
    </div>
  `;

  if (state.strategy === 'leaps' && state.leapsDirection === 'open') {
    const bind = (id, key) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('focus', () => { pushUndo(); cancelFullRender(); });
      el.addEventListener('input', e => {
        state[key] = e.target.value;
        if (key === 'nav') saveNav(e.target.value);
        _onExposureFieldInput(key, e.target.value);
        updateVerdictsInPlace();
      });
      el.addEventListener('blur', () => scheduleFullRender());
    };
    bind('in-nav', 'nav');
    bind('in-ex', 'existingExposure');
    bind('in-bg', 'budget');
    bind('in-leaps-strike', 'leapsStrike');
    bind('in-leaps-contracts', 'leapsContracts');
    const bcSeg = document.getElementById('bluechip-seg');
    if (bcSeg) {
      bcSeg.querySelector(`button[data-v="${state.leapsBluechip ? 'yes' : 'no'}"]`)?.classList.add('active');
      bcSeg.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => { pushUndo(); state.leapsBluechip = b.dataset.v === 'yes'; render(); });
      });
    }
  }

  // CSP position sizing wiring
  if (state.strategy === 'csp') {
    const bind = (id, key) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('focus', () => { pushUndo(); cancelFullRender(); });
      el.addEventListener('input', e => {
        state[key] = e.target.value;
        if (key === 'nav') saveNav(e.target.value);
        _onExposureFieldInput(key, e.target.value);
        updateVerdictsInPlace();
      });
      el.addEventListener('blur', () => scheduleFullRender());
    };
    bind('in-nav', 'nav');
    bind('in-csp-ex-total', 'cspExistingTotal');
    // Strike + Contracts inputs · auto-recompute nominal on change
    const updateComputedNominalDisplay = () => {
      const disp = document.querySelector('.config .computed-value');
      if (!disp) return;
      const s = parseFloat(state.cspStrike) || 0;
      const c = parseFloat(state.cspContracts) || 0;
      const nom = s * 100 * c;
      if (nom > 0) disp.textContent = '$' + Math.round(nom).toLocaleString();
      else disp.innerHTML = '<span style="color:var(--text-faint);">先填 STK + 张数</span>';
    };
    const bindStrikeContract = (id, key) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('focus', () => { pushUndo(); cancelFullRender(); });
      el.addEventListener('input', e => {
        state[key] = e.target.value;
        // Recompute nominal for CSP
        const strikeN = parseFloat(state.cspStrike) || 0;
        const contractsN = parseFloat(state.cspContracts) || 0;
        if (strikeN > 0 && contractsN > 0) {
          state.cspThisNominal = String(strikeN * 100 * contractsN);
        } else {
          state.cspThisNominal = '';
        }
        updateComputedNominalDisplay();
        updateVerdictsInPlace();
      });
      el.addEventListener('blur', () => scheduleFullRender());
    };
    bindStrikeContract('in-csp-strike', 'cspStrike');
    bindStrikeContract('in-csp-contracts', 'cspContracts');
    bind('in-csp-ticker-ex', 'cspTickerExisting');
    const vSeg = document.getElementById('csp-vol-seg');
    if (vSeg) {
      if (state.cspVolTier) vSeg.querySelector(`button[data-v="${state.cspVolTier}"]`)?.classList.add('active');
      vSeg.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => { pushUndo(); state.cspVolTier = b.dataset.v; render(); });
      });
    }
  }

  // Ticker input (always present in checklist)
  if (typeof _bindCspQuote === 'function') setTimeout(_bindCspQuote, 0);
  setTimeout(() => {
    const te = document.getElementById('in-ticker');
    if (te && !te.dataset.tcBound) { te.dataset.tcBound = '1'; te.addEventListener('input', scheduleTech); }
    const t = _normTicker(state.ticker);
    if (t && (!__px[t] || Date.now() - __px[t].at > 60000)) refreshTech();
  }, 0);
  const tickerEl = document.getElementById('in-ticker');
  if (tickerEl) {
    tickerEl.addEventListener('focus', () => { pushUndo(); cancelFullRender(); });
    tickerEl.addEventListener('input', e => {
      const v = e.target.value.toUpperCase();
      if (v !== e.target.value) {
        const pos = e.target.selectionStart;
        e.target.value = v;
        try { e.target.setSelectionRange(pos, pos); } catch (err) {}
      }
      const prevTicker = _normTicker(state.ticker);
      state.ticker = v;
      if (_normTicker(v) !== prevTicker) _resetTickerAutoFlags();
      // Live toggle empty highlight state without full re-render
      const bar = document.getElementById('ticker-bar');
      if (bar) {
        if (v) bar.classList.remove('ticker-empty');
        else bar.classList.add('ticker-empty');
        const label = bar.querySelector('.ticker-label');
        if (label) label.textContent = v ? 'Ticker' : 'Ticker · 请填写';
      }
      updateVerdictsInPlace();  // auto exposure + simulation + verdicts follow the ticker (saves draft)
    });
    tickerEl.addEventListener('blur', () => scheduleFullRender());
  }

  items.forEach(it => {
    if (it.positionCheck || it.regimeCheck) return;
    if (it.numeric) {
      const el = document.getElementById(`num-${it.id}`);
      if (el) {
        el.addEventListener('focus', () => { pushUndo(); cancelFullRender(); });
        el.addEventListener('input', e => {
          state.items[it.id] = e.target.value;
          updateVerdictsInPlace();
          // For items whose value is referenced by OTHER items' thresholds,
          // schedule a debounced full re-render so dependent items update live.
          if (it.id === 'cost_basis') scheduleFullRender(500);
        });
        el.addEventListener('blur', () => scheduleFullRender());
      }
    } else {
      const p = document.getElementById(`pass-${it.id}`);
      const f = document.getElementById(`fail-${it.id}`);
      if (p) p.addEventListener('click', () => { pushUndo(); state.items[it.id] = state.items[it.id] === 'pass' ? null : 'pass'; render(); });
      if (f) f.addEventListener('click', () => { pushUndo(); state.items[it.id] = state.items[it.id] === 'fail' ? null : 'fail'; render(); });
    }
  });
}

/* ==========================================================
 * PARTIAL UPDATES (no DOM rebuild — preserves input focus)
 * ========================================================== */
let __fullRenderTimer = null;
function scheduleFullRender(delay = 250) {
  cancelFullRender();
  __fullRenderTimer = setTimeout(() => {
    __fullRenderTimer = null;
    // Only re-render if no input is currently focused
    const ae = document.activeElement;
    if (!ae || ae.tagName !== 'INPUT') {
      render();
    }
  }, delay);
}
function cancelFullRender() {
  if (__fullRenderTimer) { clearTimeout(__fullRenderTimer); __fullRenderTimer = null; }
}

function updateVerdictsInPlace() {
  syncAutoExposure();
  _applyAutoExposureToDOM();
  const items = currentItems();
  const v = overallVerdict();

  // Status bar main text
  const $statusMain = document.getElementById('status-main');
  if ($statusMain) {
    const cls = v.status === 'BLOCKED' ? 'fail'
      : v.status.startsWith('CLEAR TO OPEN · 软执行') || v.status.startsWith('CLEAR TO CLOSE · 软执行') ? 'pass-soft'
      : v.status.startsWith('CLEAR') ? 'pass'
      : 'pending';
    $statusMain.className = 'status-main ' + cls;
    $statusMain.textContent = v.status;
  }

  // Progress bar
  const $progressBar = document.getElementById('progress-bar');
  if ($progressBar) {
    const total = v.total || 1;
    const passPct = (v.pass / total * 100).toFixed(1);
    const failPct = (v.fail / total * 100).toFixed(1);
    const $pass = $progressBar.querySelector('.progress-fill-pass');
    const $fail = $progressBar.querySelector('.progress-fill-fail');
    if ($pass) $pass.style.width = passPct + '%';
    if ($fail) $fail.style.width = failPct + '%';
  }

  // Update status-bar verdict class (for gradient line color)
  const $bar = document.querySelector('.status-bar');
  if ($bar) {
    $bar.classList.remove('verdict-blocked', 'verdict-pending', 'verdict-clear');
    if (v.status === 'BLOCKED') $bar.classList.add('verdict-blocked');
    else if (v.status === 'PENDING') $bar.classList.add('verdict-pending');
    else $bar.classList.add('verdict-clear');
  }

  // Tally counts (top) — A1 number rolling animation
  const $tally = document.getElementById('status-tally');
  if ($tally) {
    const targets = { pass: v.pass, hard: v.hardFail, soft: v.softFail, pending: v.pending };
    $tally.querySelectorAll('.tally-num').forEach(el => {
      const key = el.dataset.key;
      const from = parseInt(el.textContent) || 0;
      const to = targets[key] ?? 0;
      if (from !== to) animateNumber(el, from, to, 350);
    });
  }

  // Status note (top)
  const $note = document.getElementById('status-note');
  if ($note) $note.textContent = v.note;

  // Bottom summary bar (sticky action bar mirror of top)
  const $bottomMain = document.getElementById('bottom-status-main');
  if ($bottomMain) {
    const cls = v.status === 'BLOCKED' ? 'fail'
      : v.status.startsWith('CLEAR TO OPEN · 软执行') || v.status.startsWith('CLEAR TO CLOSE · 软执行') ? 'pass-soft'
      : v.status.startsWith('CLEAR') ? 'pass'
      : 'pending';
    $bottomMain.className = 'sab-status ' + cls;
    $bottomMain.textContent = v.status;
  }
  const $bottomNote = document.getElementById('bottom-status-note');
  if ($bottomNote) $bottomNote.textContent = v.note;

  // Update progress ring in sticky action bar
  const total = v.total || 0;
  const done = total - v.pending;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  const ringColor = v.status === 'BLOCKED' ? 'var(--fail)'
    : v.status.startsWith('CLEAR') ? 'var(--pass)'
    : 'var(--pending)';
  const $ringNum = document.getElementById('sab-ring-num');
  if ($ringNum) {
    const cur = parseInt($ringNum.textContent) || 0;
    if (cur !== pct) {
      // Animate the number, then append %
      const from = cur, to = pct;
      if ($ringNum.__animId) cancelAnimationFrame($ringNum.__animId);
      const startT = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - startT) / 350);
        const eased = 1 - Math.pow(1 - t, 3);
        $ringNum.textContent = Math.round(from + (to - from) * eased) + '%';
        if (t < 1) $ringNum.__animId = requestAnimationFrame(step);
      };
      $ringNum.__animId = requestAnimationFrame(step);
    }
  }
  const $ring = document.querySelector('.sab-ring circle:nth-child(2)');
  if ($ring) {
    const circumference = 2 * Math.PI * 22;
    $ring.setAttribute('stroke-dashoffset', circumference * (1 - pct / 100));
    $ring.setAttribute('stroke', ringColor);
  }

  // Each item's class + numeric badge
  items.forEach(it => {
    const $item = document.getElementById(`item-${it.id}`);
    if (!$item) return;  // Item isn't in DOM yet (conditional, waiting for full re-render)
    const newV = itemVerdict(it);
    const hardCls = it.hard && newV === 'fail' ? ' hard-fail' : '';
    $item.className = 'item ' + newV + hardCls;

    if (it.numeric) {
      const $badge = document.getElementById(`badge-${it.id}`);
      if ($badge) {
        $badge.className = 'item-numeric-verdict ' + (newV === 'pass' || newV === 'fail' ? newV : '');
        $badge.textContent = newV === 'pass' ? 'PASS' : newV === 'fail' ? 'BLOCK' : '';
      }
    }
  });

  // Group counts (X / Y)
  const groupCounts = {};
  items.forEach(it => {
    if (!groupCounts[it.group]) groupCounts[it.group] = { pass: 0, total: 0 };
    groupCounts[it.group].total++;
    if (itemVerdict(it) === 'pass') groupCounts[it.group].pass++;
  });
  document.querySelectorAll('.group').forEach($grp => {
    const $title = $grp.querySelector('.group-title');
    const $count = $grp.querySelector('.group-count');
    if ($title && $count) {
      const name = $title.textContent;
      if (groupCounts[name]) {
        $count.textContent = `${groupCounts[name].pass} / ${groupCounts[name].total}`;
      }
    }
  });

  // Position summary (LEAPS open only)
  const $posSum = document.getElementById('position-summary');
  if ($posSum && state.strategy === 'leaps' && state.leapsDirection === 'open') {
    const pctVal = positionUsedPct();
    const cap = positionCapPct();
    const pctCls = pctVal == null ? '' : (pctVal <= cap ? 'pass' : 'fail');
    const pctDisp = pctVal == null ? '—' : pctVal.toFixed(1) + '%';
    $posSum.className = 'position-summary ' + pctCls;
    const $val = $posSum.querySelector('.position-summary-val');
    if ($val) {
      $val.className = 'position-summary-val ' + pctCls;
      $val.innerHTML = `${pctDisp} <span style="color:var(--text-faint); font-weight:400;"> / cap ${cap}%</span>`;
    }
  }

  // CSP position summaries (live — previously only refreshed on blur)
  if (state.strategy === 'csp') {
    const cs = _cspSummaryState();
    [['csp-total-summary', cs.totalCls, cs.totalHTML], ['csp-ticker-summary', cs.tickerCls, cs.tickerHTML]].forEach(([id, cls, html]) => {
      const box = document.getElementById(id);
      if (!box) return;
      box.className = 'position-summary ' + cls;
      const val = box.querySelector('.position-summary-val');
      if (val) { val.className = 'position-summary-val ' + cls; val.innerHTML = html; }
    });
  }

  // R:R desc + badge live update
  const $rrDesc = document.getElementById('rr-desc');
  if ($rrDesc) $rrDesc.textContent = rrCheckDesc();
  const $rrBadge = document.getElementById('badge-rr_check');
  if ($rrBadge) {
    const rrItem = items.find(i => i.id === 'rr_check');
    if (rrItem) {
      const rrV = itemVerdict(rrItem);
      $rrBadge.className = 'item-numeric-verdict' + (rrV === 'pass' ? ' pass' : rrV === 'fail' ? ' fail' : rrV === 'pending' ? ' pending' : '');
      $rrBadge.textContent = rrV === 'pass' ? 'PASS' : rrV === 'fail' ? 'BLOCK' : rrV === 'pending' ? 'INSUFF' : '';
      const $rrItem = document.getElementById('item-rr_check');
      if ($rrItem) {
        $rrItem.classList.remove('pass', 'fail', 'pending');
        $rrItem.classList.add(rrV);
      }
    }
  }

  // Max-size helper live refresh
  const $cmx = document.getElementById('csp-max'); if ($cmx) $cmx.innerHTML = cspMaxInnerHTML();
  const $lmx = document.getElementById('leaps-max'); if ($lmx) $lmx.innerHTML = leapsMaxInnerHTML();
  // Post-trade simulation live refresh (Portfolio Risk layer)
  const $sim = document.getElementById('portfolio-sim');
  if ($sim) $sim.innerHTML = portfolioSimInnerHTML();

  // Save draft after any state change
  scheduleSaveDraft();
}

function itemHTML(it) {
  const v = itemVerdict(it);
  // Special OR-pair compensation: no_earnings HARD is soft-downgraded when earnings_exit_plan passes (CSP only)
  const isCompensated = state.strategy === 'csp'
    && it.id === 'no_earnings'
    && v === 'fail'
    && state.items['earnings_exit_plan'] === 'pass';
  // Effective HARD flag — false when compensated, so hard-badge and hard-fail class are suppressed
  const effectiveHard = it.hard && !isCompensated;
  const hardBadge = effectiveHard ? `<span class="hard-badge">Hard block</span>` : (isCompensated ? `<span class="hard-badge hard-badge-compensated">HARD · 已由例外抵消</span>` : '');
  const hardClass = effectiveHard && v === 'fail' ? 'hard-fail' : '';

  // Special render for R:R computed check
  if (it.id === 'rr_check') {
    const verdictText = v === 'pass' ? `<span class="item-numeric-verdict pass" id="badge-${esc(it.id)}">PASS</span>` :
                        v === 'fail' ? `<span class="item-numeric-verdict fail" id="badge-${esc(it.id)}">BLOCK</span>` :
                        v === 'pending' ? `<span class="item-numeric-verdict pending" id="badge-${esc(it.id)}">INSUFF</span>` :
                        `<span class="item-numeric-verdict" id="badge-${esc(it.id)}"></span>`;
    return `
      <div class="item ${v} ${hardClass}" id="item-${esc(it.id)}">
        <div class="item-head">
          <div class="item-text">
            <div class="item-title">${esc(it.title)}</div>
            <div class="item-desc" id="rr-desc">${esc(rrCheckDesc())}</div>
          </div>
          ${verdictText}
        </div>
      </div>
    `;
  }

  if (it.numeric) {
    const val = state.items[it.id] ?? '';
    const n = it.numeric;
    let req = '';
    if (n.priceField) req = '';  // No required label for price fields
    else if (n.label) req = `Required: ${n.label}${n.unit ? ' ' + n.unit : ''}`;
    else if (n.range) req = `Required: ${n.range[0]} – ${n.range[1]} ${n.unit || ''}`;
    else if (n.min != null) req = `Required: ${n.comparator} ${n.min}${n.unit ? ' ' + n.unit : ''}`;
    else if (n.max != null) req = `Required: ${n.comparator} ${n.max}${n.unit ? ' ' + n.unit : ''}`;
    if (n.optional) req += ' (可留空)';
    let verdictText = v === 'pass' ? `<span class="item-numeric-verdict pass" id="badge-${esc(it.id)}">PASS</span>` :
                      v === 'fail' ? `<span class="item-numeric-verdict fail" id="badge-${esc(it.id)}">BLOCK</span>` :
                      `<span class="item-numeric-verdict" id="badge-${esc(it.id)}"></span>`;
    return `
      <div class="item ${v} ${hardClass}" id="item-${esc(it.id)}">
        <div class="item-head">
          <div class="item-text">
            <div class="item-title">${esc(it.title)} ${hardBadge}</div>
            ${it.desc ? `<div class="item-desc">${esc(it.desc)}</div>` : ''}
          </div>
        </div>
        <div class="item-numeric">
          <input class="item-numeric-input${state.quoteFill && state.quoteFill[it.id] != null && state.quoteFill[it.id] === val ? ' autofilled' : ''}" id="num-${esc(it.id)}" type="text" inputmode="decimal" autocomplete="off" autocorrect="off"
                 placeholder="${esc(n.placeholder || '')}" value="${esc(val)}">
          <span class="item-numeric-req">${esc(req)}</span>
          ${verdictText}
        </div>
      </div>
    `;
  }
  if (it.regimeCheck) {
    return `
      <div class="item ${v} ${hardClass}" id="item-${esc(it.id)}">
        <div class="item-head">
          <div class="item-text">
            <div class="item-title">${esc(it.title)} ${hardBadge}</div>
            ${it.desc ? `<div class="item-desc">${esc(it.desc)} <em style="color:var(--text-faint);">— 由首页 Market Signal 自动判定</em></div>` : ''}
          </div>
        </div>
      </div>
    `;
  }
  if (it.positionCheck) {
    return `
      <div class="item ${v} ${hardClass}" id="item-${esc(it.id)}">
        <div class="item-head">
          <div class="item-text">
            <div class="item-title">${esc(it.title)} ${hardBadge}</div>

}

// Safe localStorage save that handles quota exceeded errors + warns user
function safeSetItem(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (e) {
    const isQuota = e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014 || /quota/i.test(e.message || '');
    if (isQuota) {
      // Try to warn user prominently, but showToast may not be defined yet if called early
      if (typeof showToast === 'function') {
        showToast('存储空间已满', 'error', '立即 Sync 上传到 Gist, 然后清理本地历史');
      } else {
        console.error('localStorage quota exceeded');
      }
    } else {
      if (typeof showToast === 'function') {
        showToast('保存失败', 'error', e.message || String(e));
      }
    }
    return false;
  }
}
window.safeSetItem = safeSetItem;

// Detect localStorage quota per browser (best-effort, cached).
// Chrome/Edge/Firefox: ~10 MB · Safari (Mac + iOS): ~5 MB
let _cachedStorageQuota = null;
function detectStorageQuota() {
  if (_cachedStorageQuota) return _cachedStorageQuota;
  const ua = navigator.userAgent || '';
  const isSafari = /Safari/.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|Edg/.test(ua);
  _cachedStorageQuota = isSafari ? 5 * 1024 * 1024 : 10 * 1024 * 1024;
  return _cachedStorageQuota;
}

// Estimate localStorage usage (approximate — returns { used: bytes, ratio: 0-1, quota: bytes })
function estimateStorageUsage() {
  try {
    let total = 0;
    for (const k of Object.keys(localStorage)) {
      const v = localStorage.getItem(k) || '';
      total += (k.length + v.length) * 2;  // UTF-16 = 2 bytes per char
    }
    const quota = detectStorageQuota();
    return { used: total, ratio: total / quota, quota };
  } catch (e) { return { used: 0, ratio: 0, quota: 5 * 1024 * 1024 }; }
}
window.estimateStorageUsage = estimateStorageUsage;

/* ==========================================================
 * UNDO SYSTEM (Ctrl/Cmd + Z)
 * ========================================================== */
const undoStack = [];
const UNDO_LIMIT = 500;

function pushUndo() {
  if (!state.strategy) return;
  try {
    const snapshot = JSON.stringify(snapshotStateForStorage());
    // Skip if identical to top of stack
    if (undoStack.length && undoStack[undoStack.length - 1] === snapshot) return;
    undoStack.push(snapshot);
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  } catch (e) {}
}
function undo() {
  if (undoStack.length === 0) {
    showToast('无可撤销', 'info');
    return;
  }
  try {
    const prev = JSON.parse(undoStack.pop());
    restoreStateFromStorage(prev);
    render();
    showToast('已撤销', 'info');
  } catch (e) {
    showToast('撤销失败', 'error');
  }
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
    const tag = document.activeElement ? document.activeElement.tagName : '';
    // Don't interfere with native text input undo
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    e.preventDefault();
    undo();
  }
});

function restoreStateFromStorage(saved) {
  if (!saved) return;

  if (saved.leapsStyle === 'standard' || saved.leapsStyle === 'aggressive') {

const HISTORY_KEY = 'pretrade_history';

function loadHistory() {

// Filter out tombstones for display / stats / export
function getActiveHistory() {

function saveToHistory() {
  if (!state.strategy) return;
  syncAutoExposure();
  try {
    const history = loadHistory();
    const items = currentItems();
    const v = overallVerdict();
    const inputs = [];
    items.forEach(it => {
      if (it.numeric) {
        const val = state.items[it.id];
        if (val != null && val !== '') inputs.push(`${it.id}=${val}`);
      }
    });
    // Include strike & contracts in inputs for later ID + Auto compute reliability
    if (state.strategy === 'csp') {
      if (state.cspStrike) inputs.push(`strike=${state.cspStrike}`);
      if (state.cspContracts) inputs.push(`contracts=${state.cspContracts}`);
    }
    if (state.strategy === 'leaps') {
      if (state.leapsStrike) inputs.push(`strike=${state.leapsStrike}`);
      if (state.leapsContracts) inputs.push(`contracts=${state.leapsContracts}`);
      // Include computed R:R ratio for historical reference (derived from entry/stop/target)
      const rr = computeRR();
      if (rr && !rr.error) {
        inputs.push(`rr=${rr.rr.toFixed(2)}`);
        inputs.push(`downside=${rr.downsidePct.toFixed(1)}%`);
        inputs.push(`upside=${rr.upsidePct.toFixed(1)}%`);
      }
    }
    let exposurePct = '', capPct = '';
    if (state.strategy === 'leaps' && state.leapsDirection === 'open') {
      const p = positionUsedPct();
      if (p != null) exposurePct = p.toFixed(1);
      capPct = positionCapPct();
    }
    const entry = {
      id: 'snap_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      timestamp: nowStamp(),
      timestampSort: Date.now(),
      updatedAt: Date.now(),
      ticker: state.ticker || '',
      strategy: STRAT_LABEL[state.strategy] || '',
      subtype: subtypeString(),
      verdict: v.status,
      pass: v.pass, fail: v.fail, pending: v.pending,
      hardFails: items.filter(it => it.hard && itemVerdict(it) === 'fail').map(it => it.title),
      failed: items.filter(it => itemVerdict(it) === 'fail').map(it => it.title),
      pendingItems: items.filter(it => itemVerdict(it) === 'pending').map(it => it.title),
      inputs: inputs.join('; '),
      nav: state.nav || '',
      existing: state.existingExposure || '',
      budget: state.budget || '',
      exposurePct, capPct,
      outcome: null,
      notes: '',
      fullState: snapshotStateForStorage()
    };
    const rocNow = loadRocPhase();
    entry.rocPhase = rocNow ? rocNow.phase : null;
    entry.fullState.rocPhaseAtSave = rocNow ? rocNow.phase : null;
    if (rocNow) entry.inputs = (entry.inputs ? entry.inputs + '; ' : '') + `roc=${rocNow.phase}`;
    try {
      const rk = computeRisk().composite;
      if (rk != null) { entry.riskScore = Math.round(rk); entry.inputs = (entry.inputs ? entry.inputs + '; ' : '') + `risk=${entry.riskScore}`; }
    } catch (e) {}
    history.unshift(entry);
    if (history.length > HISTORY_MAX) history.length = HISTORY_MAX;
    safeSetItem(HISTORY_KEY, JSON.stringify(history));
    scheduleAutoPushToGist();
  } catch (e) {}
}
function deleteHistoryEntry(id) {
  const history = loadHistory();
  const idx = history.findIndex(e => e.id === id);
  if (idx === -1) return;
  const originalEntry = { ...history[idx] };
  // Confirmation dialog — prevent accidental deletion via mis-click
  const label = originalEntry.ticker
    ? `${originalEntry.ticker} · ${originalEntry.strategy || ''} · ${originalEntry.timestamp || ''}`
    : `${originalEntry.strategy || 'snapshot'} · ${originalEntry.timestamp || ''}`;
  if (!confirm(`确认删除 snapshot?\n\n${label}\n\n删除后有 10 秒可撤销.`)) return;
  // Replace with tombstone so deletion propagates via sync
  history[idx] = {
    id: originalEntry.id,
    _deleted: true,
    _deletedAt: Date.now(),
    timestampSort: originalEntry.timestampSort || Date.now()
  };
  try { safeSetItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  if (state._view === 'history') renderHistoryList();
  else render();
  scheduleAutoPushToGist();
  // Toast with undo · 10 秒
  showToast('已删除', 'info', originalEntry.ticker ? originalEntry.ticker + ' · ' + originalEntry.strategy : '', {
    undo: true,
    duration: 10000,
    onUndo: () => {
      const h = loadHistory();
      const i = h.findIndex(e => e.id === id);
      if (i !== -1) {
        h[i] = originalEntry;
        try { safeSetItem(HISTORY_KEY, JSON.stringify(h)); } catch (e) {}
        if (state._view === 'history') renderHistoryList();
        else render();
        scheduleAutoPushToGist();
        showToast('已恢复', 'success', originalEntry.ticker || '');
      }
    }
  });
}

// Temporarily swap global state to a snapshot state, run fn, restore.
// Used by edit modal to recompute verdict using a modified fullState.
// >0 while a saved snapshot is being evaluated. Global signals (market regime) must use
// the value recorded in the snapshot, never today's — otherwise editing an old snapshot
// would silently re-judge it against the current market.
let __tempStateDepth = 0;
function withTempState(tempState, fn) {
  const backup = JSON.parse(JSON.stringify(state));
  const clone = JSON.parse(JSON.stringify(tempState || {}));
  Object.keys(state).forEach(k => delete state[k]);
  Object.assign(state, clone);
  __tempStateDepth++;
  try {
    return fn();
  } finally {
    __tempStateDepth--;
    Object.keys(state).forEach(k => delete state[k]);
    Object.assign(state, backup);
  }
}

function editHistoryEntry(id, updates) {
  const history = loadHistory();
  const idx = history.findIndex(e => e.id === id);
  if (idx === -1) return;
  if (history[idx]._deleted) return;  // Don't edit tombstones
  history[idx] = { ...history[idx], ...updates, updatedAt: Date.now() };
  try { safeSetItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  // Refresh whatever view user is on: history page → renderHistoryList; main page → render
  if (state._view === 'history') renderHistoryList();
  else render();
  scheduleAutoPushToGist();
}

// Update only the fullState inside an entry (used for live re-render in edit modal)
function editHistoryEntryFullState(id, newFullState) {

  const idx = history.findIndex(e => e.id === id);
  if (idx === -1) return;
  if (history[idx]._deleted) return;
  history[idx] = { ...history[idx], fullState: newFullState };
  try { safeSetItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
}
